name: P8 Temporary Full Validation

on:
  push:
    branches:
      - agent/p8-legacy-ids

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch exact external compile dependencies
        run: bash scripts/fetch_ci_dependencies.sh

      - name: Repository validator
        run: ./scripts/validate_repository.sh

      - name: Clean Java 21 build and tests
        run: ./gradlew clean build --stacktrace

      - name: Strict historical-ID ownership audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/main/java')
          legacy = Path('src/main/java/com/redslovesgames/tideborne/migration/legacy/ids')
          leaks = []
          for path in root.rglob('*.java'):
              posix = path.as_posix()
              if path.is_relative_to(legacy) or '/fishing/gametest/' in posix:
                  continue
              source = path.read_text()
              for token in ('tide_traits', 'tide_team_journal', 'tidebound_compatibility'):
                  if f'"{token}"' in source:
                      leaks.append(f'{posix}: raw quoted namespace {token}')
          if leaks:
              raise SystemExit('\n'.join(leaks))
          print('NORMAL_PRODUCTION_HISTORICAL_NAMESPACE_LEAKS=0')
          PY

      - name: P7 compatibility alias boundary
        shell: bash
        run: |
          test -f src/main/resources/assets/tide_traits/lang/en_us.json
          test -f src/main/resources/assets/tidebound_compatibility/lang/en_us.json
          test -f src/main/resources/data/tide_traits/recipe/anglers_satchel.json
          test -f src/main/resources/data/tide_traits/function/test_tuna_mutations.mcfunction
          test "$(find src/main/resources/data/tide_traits/tags/item -type f | wc -l)" -eq 8
          test "$(find src/main/resources/data/tidebound_compatibility/recipe -type f | wc -l)" -eq 11
          test "$(find src/main/resources/data/tidebound_compatibility/tags/item -type f | wc -l)" -eq 8
          python3 - <<'PY'
          import json
          fabric=json.load(open('src/main/resources/fabric.mod.json'))
          expected={'tide_traits','tide_team_journal','tidebound_compatibility'}
          assert expected <= set(fabric.get('provides', []))
          print('P7_COMPATIBILITY_ALIASES=pass')
          PY

      - name: Release artifact validation and SHA
        shell: bash
        run: |
          version="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '[:space:]')"
          artifact="build/libs/tideborne-${version}.jar"
          test -f "$artifact"
          ./scripts/validate_release_artifact.sh "$artifact"
          echo "ARTIFACT=$artifact"
          sha256sum "$artifact"

      - name: Unit test count
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total=0
          failures=0
          errors=0
          for path in glob.glob('build/test-results/test/*.xml'):
              root=ET.parse(path).getroot()
              total += int(root.attrib.get('tests',0))
              failures += int(root.attrib.get('failures',0))
              errors += int(root.attrib.get('errors',0))
          print(f'UNIT_TEST_COUNT={total}')
          print(f'UNIT_TEST_FAILURES={failures}')
          print(f'UNIT_TEST_ERRORS={errors}')
          assert total > 0 and failures == 0 and errors == 0
          PY
