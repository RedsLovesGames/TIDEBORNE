name: Tideborne Wiki CI

on:
  push:
    branches:
      - wiki/official-field-guide
    paths:
      - 'site/**'
      - 'docs/wiki/**'
      - '.github/workflows/wiki-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Run website tests
        working-directory: site
        run: npm test -- --passWithNoTests

      - name: Generate pinned fish catalog
        working-directory: site
        run: npm run import:fish

      - name: Commit normalized fish catalog once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/src/data/generated/fish.json && git ls-files --error-unmatch site/src/data/generated/fish.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/generated/fish.json
          git commit -m "chore(wiki): snapshot normalized fish catalog"
          git push origin HEAD:wiki/official-field-guide

      - name: Typecheck and build
        working-directory: site
        run: npm run build

      - name: Verify repository base-path output
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          if grep -R -E '(href|src)="/(fish|assets)/' dist --include='*.html'; then
            echo 'Found a root-relative custom link that would break under /TIDEBORNE.' >&2
            exit 1
          fi
