name: Tideborne Wiki CI

on:
  push:
    branches:
      - wiki/official-field-guide
    paths:
      - 'site/**'
      - 'docs/wiki/**'
      - '.github/workflows/wiki-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Run website tests
        working-directory: site
        run: npm test -- --passWithNoTests

      - name: Typecheck and build
        working-directory: site
        run: npm run build

      - name: Validate built routes and links
        working-directory: site
        run: npm run validate:build

      - name: Verify repository base-path output
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          if grep -R -E '(href|src)="/(fish|assets)/' dist --include='*.html'; then
            echo 'Found a root-relative custom link that would break under /TIDEBORNE.' >&2
            exit 1
          fi
