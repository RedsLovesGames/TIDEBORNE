name: One-shot Tideborne package ownership cleanup v2

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/package-ownership-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Guard dev only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git branch --show-current)" = "dev"
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch exact external compile dependencies
        run: bash scripts/fetch_ci_dependencies.sh

      - name: Run corrected ownership migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/package-ownership-cleanup.yml').read_text(encoding='utf-8')
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''        if tail == "trait" or tail.startswith("trait."):\n            suffix = tail[len("trait"):]\n            return "com.redslovesgames.tideborne.fishing.specimen" + suffix'''
          new = '''        if tail == "trait" or tail.startswith("trait."):\n            suffix = tail[len("trait"):]\n            return "com.redslovesgames.tideborne.fishing.specimen.legacy" + suffix'''
          if old not in script:
              raise SystemExit('Could not patch historical Tide Traits trait ownership')
          script = script.replace(old, new, 1)

          old_no_type = '''    pm = package_re.search(text)\n    tm = type_re.search(text)\n    if not pm or not tm:\n        continue\n    old_pkg = pm.group(1)\n    cls = tm.group(1)'''
          new_no_type = '''    pm = package_re.search(text)\n    tm = type_re.search(text)\n    if not pm:\n        continue\n    old_pkg = pm.group(1)\n    cls = tm.group(1) if tm else path.stem'''
          if old_no_type not in script:
              raise SystemExit('Could not patch package-only Java source handling')
          script = script.replace(old_no_type, new_no_type, 1)

          summary_write = '''Path("/tmp/tideborne-package-cleanup-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")'''
          map_and_summary_write = '''Path("/tmp/tideborne-package-fqcn-map.json").write_text(json.dumps(fqcn_map, indent=2, sort_keys=True), encoding="utf-8")\nPath("/tmp/tideborne-package-cleanup-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")'''
          if summary_write not in script:
              raise SystemExit('Could not add moved FQCN map output')
          script = script.replace(summary_write, map_and_summary_write, 1)

          Path('/tmp/package_migration.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/package_migration.py

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from collections import defaultdict
          from pathlib import Path

          MAIN = Path('src/main/java')
          TEST = Path('src/test/java')
          package_re = re.compile(r'(?m)^package\s+([\w.]+);')
          type_re = re.compile(r'(?m)^(?:public\s+)?(?:final\s+|abstract\s+|sealed\s+|non-sealed\s+)?(?:class|record|interface|enum)\s+(\w+)')
          import_re = re.compile(r'(?m)^import\s+(?:static\s+)?([\w.*]+);')
          old_wildcard_re = re.compile(
              r'(?m)^import\s+(?:com\.redslovesgames\.(?:tidetraits|tideteamjournal|tideboundcompatibility)(?:\.[\w.]+)?|com\.redslovesgames\.tideborne\.fishing\.v2(?:\.[\w.]+)?)\.\*;\s*\n?'
          )

          fqcn_map = json.loads(Path('/tmp/tideborne-package-fqcn-map.json').read_text(encoding='utf-8'))
          moved_by_simple = defaultdict(list)
          for new_fqcn in fqcn_map.values():
              moved_by_simple[new_fqcn.rsplit('.', 1)[-1]].append(new_fqcn)

          canonical_specimen = 'com.redslovesgames.tideborne.fishing.specimen.SpecimenData'
          legacy_specimen = 'com.redslovesgames.tideborne.fishing.specimen.legacy.SpecimenData'

          def choose_target(simple: str, candidates: list[str], current_pkg: str, current_fqcn: str, text: str) -> str | None:
              candidates = sorted(set(candidates))
              if current_fqcn in candidates:
                  return None
              if len(candidates) == 1:
                  return candidates[0]
              if simple == 'SpecimenData':
                  if current_pkg.startswith('com.redslovesgames.tideborne.fishing.specimen.legacy'):
                      return None
                  if f'import {legacy_specimen};' in text:
                      return None
                  return canonical_specimen
              return None

          def repair_tree(root: Path, allow_test_types: bool) -> None:
              if not root.exists():
                  return
              for path in sorted(root.rglob('*.java')):
                  text = path.read_text(encoding='utf-8')
                  pm = package_re.search(text)
                  if not pm:
                      continue
                  current_pkg = pm.group(1)
                  tm = type_re.search(text)
                  current_fqcn = current_pkg + '.' + (tm.group(1) if tm else path.stem)

                  text = old_wildcard_re.sub('', text)
                  existing = import_re.findall(text)
                  existing_simple = {
                      imported.rsplit('.', 1)[-1]
                      for imported in existing
                      if not imported.endswith('.*')
                  }
                  missing = set()
                  for simple, candidates in moved_by_simple.items():
                      if not re.search(rf'\b{re.escape(simple)}\b', text):
                          continue
                      target = choose_target(simple, candidates, current_pkg, current_fqcn, text)
                      if target is None:
                          continue
                      target_pkg = target.rsplit('.', 1)[0]
                      if target_pkg == current_pkg or simple in existing_simple:
                          continue
                      if f'import {target};' in text:
                          continue
                      missing.add(target)

                  if missing:
                      package_match = package_re.search(text)
                      assert package_match is not None
                      insertion = '\n\n' + '\n'.join(f'import {fqcn};' for fqcn in sorted(missing))
                      text = text[:package_match.end()] + insertion + text[package_match.end():]

                  path.write_text(text, encoding='utf-8')

          repair_tree(MAIN, False)
          repair_tree(TEST, True)

          validator = Path('scripts/validate_repository.sh')
          validator_text = validator.read_text(encoding='utf-8')
          validator_text = validator_text.replace(
              "if rg -n '^package ",
              "if grep -R -n -E --include='*.java' '^package ",
              1,
          )
          validator.write_text(validator_text, encoding='utf-8')

          stale_wildcards = []
          for root in (MAIN, TEST):
              if not root.exists():
                  continue
              for path in root.rglob('*.java'):
                  text = path.read_text(encoding='utf-8')
                  if old_wildcard_re.search(text):
                      stale_wildcards.append(str(path))
          if stale_wildcards:
              raise SystemExit('Historical Java wildcard imports remain: ' + ', '.join(stale_wildcards))
          PY

      - name: Structural validation
        run: ./scripts/validate_repository.sh

      - name: Unit and architecture tests
        run: ./gradlew test --stacktrace

      - name: GameTests without optional mods
        run: ./gradlew runGametest --stacktrace

      - name: GameTests with Apex Waters
        run: ./gradlew runGametest -PincludeApexRuntime=true --stacktrace

      - name: GameTests with Myths of the Sea
        run: ./gradlew runGametest -PincludeMythsRuntime=true --stacktrace

      - name: GameTests with Apex Waters and Myths of the Sea
        run: ./gradlew runGametest -PincludeApexRuntime=true -PincludeMythsRuntime=true --stacktrace

      - name: Dedicated-server smoke
        run: ./scripts/dedicated_server_smoke.sh

      - name: Authoritative Java 21 build
        run: ./gradlew clean build --stacktrace

      - name: Validate release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '[:space:]')"
          ./scripts/validate_release_artifact.sh "build/libs/tideborne-${version}.jar"

      - name: Commit validated cleanup to dev
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/tideborne-package-cleanup-summary.json
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          rm .github/workflows/package-ownership-cleanup.yml
          rm .github/workflows/package-ownership-cleanup-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "refactor: unify Tideborne Java package ownership"
          git push origin HEAD:dev
