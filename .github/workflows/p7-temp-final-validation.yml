name: P7 Temporary Final Validation

on:
  push:
    branches:
      - agent/p7-resources

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'chore: trigger P7.6 validation' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Verify branch and architecture dependency gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/p7-resources"
          git merge-base --is-ancestor b2ea30d927c4bae15f2e9ccbdc48b61331ead9f4 HEAD
          test -f src/main/java/com/redslovesgames/tideborne/config/TideborneConfig.java
          test -f src/main/java/com/redslovesgames/tideborne/fishing/specimen/SpecimenData.java
          test -d src/main/java/com/redslovesgames/tideborne/fishing/specimen/legacy
          test -d src/main/java/com/redslovesgames/tideborne/fishing/gear
          test -d src/main/java/com/redslovesgames/tideborne/fishing/tide
          test -d src/main/java/com/redslovesgames/tideborne/ecosystem
          python3 scripts/p7_agent.py report

      - name: Fetch exact external compile dependencies
        run: bash scripts/fetch_ci_dependencies.sh

      - name: Validate repository structure
        run: ./scripts/validate_repository.sh

      - name: Final P7 resource and metadata audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          r = Path('src/main/resources')
          assets = r / 'assets'
          data = r / 'data'
          names = lambda p: {x.name for x in p.iterdir()}

          assert names(assets) == {'tide', 'tideborne', 'tide_traits', 'tidebound_compatibility'}
          assert names(data) == {'c', 'minecraft', 'myths_of_the_sea', 'tide', 'tide_traits', 'tideborne', 'tidebound_compatibility'}
          assert not (assets / 'tide_team_journal').exists()
          assert not (data / 'tide_team_journal').exists()

          assert names(assets / 'tide_traits') == {'lang', 'models'}
          assert names(assets / 'tidebound_compatibility') == {'lang', 'models'}
          assert not (assets / 'tide_traits' / 'textures').exists()
          assert not (assets / 'tidebound_compatibility' / 'textures').exists()

          assert names(data / 'tide_traits') == {'function', 'recipe', 'tags'}
          assert names(data / 'tidebound_compatibility') == {'recipe', 'tags'}
          assert not (data / 'tidebound_compatibility' / 'bait').exists()
          assert not (data / 'tidebound_compatibility' / 'rod_accessories').exists()
          assert (data / 'tideborne' / 'bait' / 'leviathan_bait.json').is_file()
          assert (data / 'tideborne' / 'rod_accessories').is_dir()

          alias = (data / 'tide_traits/function/test_tuna_mutations.mcfunction').read_text()
          canonical = (data / 'tideborne/function/test_tuna_mutations.mcfunction').read_text()
          assert alias == 'function tideborne:test_tuna_mutations\n'
          assert sum(1 for line in canonical.splitlines() if line.startswith('give @s tide:tuna[')) == 7

          fabric = json.loads((r / 'fabric.mod.json').read_text())
          assert fabric['id'] == 'tideborne'
          assert {'tide_traits','tide_team_journal','tidebound_compatibility'} <= set(fabric['provides'])
          assert fabric['suggests']['apexwaters'] == '=1.1.1'
          assert fabric['suggests']['myths_of_the_sea'] == '=1.3.0'
          assert fabric['mixins'] == [
              'tideborne.mixins.json',
              {'config':'tideborne.client.mixins.json','environment':'client'},
              'tideborne.apex.mixins.json'
          ]

          apex = json.loads((r / 'tideborne.apex.mixins.json').read_text())
          assert apex['required'] is False
          assert apex['plugin'] == 'com.redslovesgames.tideborne.mixin.tide.OptionalCompatMixinPlugin'
          assert apex['refmap'] == 'tideborne.apex.refmap.json'
          assert apex['mixins'] == ['GreatWhiteSharkMixin']

          client = json.loads((r / 'tideborne.client.mixins.json').read_text())
          assert client['required'] is False
          assert client.get('client') and not client.get('mixins')

          common = json.loads((r / 'tideborne.mixins.json').read_text())
          assert common['required'] is True
          assert common.get('mixins')
          assert common.get('client')

          for old in [
              'tide_team_journal.mixins.json', 'tide_team_journal.refmap.json',
              'tide_traits.client.mixins.json', 'tide_traits.mixins.json',
              'tidebound_compatibility.mixins.json', 'tidebound_compatibility.refmap.json',
              'tidebound_compatibility.apex.mixins.json'
          ]:
              assert not (r / old).exists(), old

          traits_lang = (assets / 'tide_traits/lang/en_us.json').read_text()
          compat_lang = (assets / 'tidebound_compatibility/lang/en_us.json').read_text()
          for forbidden in ['message.tide_traits.', 'tooltip.tide_traits.', 'screen.tide_traits.', 'config.tide_traits.']:
              assert forbidden not in traits_lang
          for forbidden in ['message.tidebound_compatibility.', 'tooltip.tidebound_compatibility.', 'screen.tidebound_compatibility.', 'toast.tidebound_compatibility.', 'key.tidebound_compatibility.']:
              assert forbidden not in compat_lang

          assert (data / 'tide/tags/item/bait_items.json').is_file()
          assert (data / 'myths_of_the_sea/tags/item/hippocampus_food.json').is_file()
          assert (data / 'c').is_dir()
          assert (data / 'minecraft').is_dir()
          print('P7.6 final static resource/metadata audit passed')
          PY
          git diff --check

      - name: Full Java 21 clean build and test suite
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --stacktrace
          unit_count="$(python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          total = 0
          for path in glob.glob('build/test-results/test/*.xml'):
              total += int(ET.parse(path).getroot().attrib.get('tests', 0))
          print(total)
          PY
          )"
          test "$unit_count" -gt 0
          echo "P7_FINAL_UNIT_TEST_COUNT=$unit_count"

      - name: Validate packaged production artifact and optional boundaries
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/tideborne-${VERSION}.jar"
          test -f "$JAR"
          ./scripts/validate_release_artifact.sh "$JAR"

          unzip -Z1 "$JAR" | grep -Fxq 'tideborne.mixins.json'
          unzip -Z1 "$JAR" | grep -Fxq 'tideborne.client.mixins.json'
          unzip -Z1 "$JAR" | grep -Fxq 'tideborne.apex.mixins.json'
          unzip -Z1 "$JAR" | grep -Fxq 'tideborne.apex.refmap.json'
          unzip -Z1 "$JAR" | grep -Fxq 'data/tide_traits/function/test_tuna_mutations.mcfunction'
          unzip -Z1 "$JAR" | grep -Fxq 'data/tideborne/function/test_tuna_mutations.mcfunction'
          unzip -p "$JAR" data/tide_traits/function/test_tuna_mutations.mcfunction | grep -Fxq 'function tideborne:test_tuna_mutations'

          for old in tide_team_journal.mixins.json tide_team_journal.refmap.json tide_traits.client.mixins.json tide_traits.mixins.json tidebound_compatibility.mixins.json tidebound_compatibility.refmap.json tidebound_compatibility.apex.mixins.json; do
            if unzip -Z1 "$JAR" | grep -Fxq "$old"; then
              echo "Legacy mixin/refmap leaked into artifact: $old" >&2
              exit 1
            fi
          done

          # Dedicated-server and optional-mod boundary invariants.
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          jar = next(Path('build/libs').glob('tideborne-*.jar'))
          with zipfile.ZipFile(jar) as z:
              fabric = json.loads(z.read('fabric.mod.json'))
              assert fabric['environment'] == '*'
              assert {'apexwaters','myths_of_the_sea'} <= set(fabric.get('suggests', {}))
              assert 'apexwaters' not in fabric.get('depends', {})
              assert 'myths_of_the_sea' not in fabric.get('depends', {})
              client_entries = [x for x in fabric['mixins'] if isinstance(x, dict)]
              assert client_entries == [{'config':'tideborne.client.mixins.json','environment':'client'}]
              apex = json.loads(z.read('tideborne.apex.mixins.json'))
              assert apex['required'] is False
              assert apex['plugin'].endswith('OptionalCompatMixinPlugin')
              assert 'assets/tide/textures/entity/fishing_bobber/hook.png' in z.namelist() or any(n.startswith('assets/tide/') for n in z.namelist())
              assert any(n.startswith('data/myths_of_the_sea/') for n in z.namelist())
          print('P7.6 packaged optional/dedicated-server boundary audit passed')
          PY

          SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          echo "P7_FINAL_ARTIFACT=$JAR"
          echo "P7_FINAL_SHA256=$SHA"
          python3 scripts/p7_agent.py report

      - name: Remove temporary P7.6 workflow and trigger
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p7-temp-final-validation.yml
          rm -f .github/P7_6_VALIDATION_TRIGGER
          git config user.name "RedsLovesGames"
          git config user.email "75150137+RedsLovesGames@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove P7.6 validation workflow"
          git push origin HEAD:agent/p7-resources
