name: Build Tideborne

on:
  push:
    branches:
      - main
      - reconstruct-1.3.57
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Validate reconstruction identifiers
        shell: bash
        run: |
          if [ -d src/main/java ]; then
            if grep -R -n -E '\b(class|method|field)_[0-9]+' src/main/java; then
              echo 'Unresolved Minecraft intermediary identifiers remain in maintained Java source.'
              exit 1
            fi
          fi

      - name: Build
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew clean build --stacktrace
          else
            gradle clean build --stacktrace
          fi

      - name: Upload built JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tideborne-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
