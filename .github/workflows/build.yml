name: Build Tideborne

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - reconstruct-1.3.57
      - agent/p10-ui-presentation
    tags:
      - '*.*.*'
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: tideborne-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch exact external compile dependencies
        run: bash scripts/fetch_ci_dependencies.sh

      - name: Validate repository structure and release metadata
        run: ./scripts/validate_repository.sh

      - name: Resolve build version and release identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '[:space:]')"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "gradle.properties mod_version is not an exact MAJOR.MINOR.PATCH semantic version: $version" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != "$version" ]]; then
              echo "Release tag $GITHUB_REF_NAME does not match gradle.properties mod_version $version" >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
              echo "Checked-out release commit does not match the tag event commit" >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Tideborne build version: $version"
          echo "Build commit: $GITHUB_SHA"

      - name: Build
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew clean build --stacktrace
          else
            gradle clean build --stacktrace
          fi

      - name: Validate production release artifact
        run: ./scripts/validate_release_artifact.sh "build/libs/tideborne-${{ steps.version.outputs.version }}.jar"

      - name: Report unit test count
        shell: bash
        run: |
          unit_count="$(python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          total = 0
          for path in glob.glob('build/test-results/test/*.xml'):
              total += int(ET.parse(path).getroot().attrib.get('tests', 0))
          print(total)
          PY
          )"
          test "$unit_count" -gt 0
          echo "UNIT_TEST_COUNT=$unit_count"

      - name: Upload built JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tideborne-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download validated JARs
        uses: actions/download-artifact@v4
        with:
          name: tideborne-${{ github.sha }}
          path: release-assets

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "Tag/version mismatch: tag=$GITHUB_REF_NAME version=$VERSION" >&2
            exit 1
          fi

          artifact="release-assets/tideborne-${VERSION}.jar"
          test -f "$artifact"

          tagged_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha')"
          if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $GITHUB_REF_NAME resolves to $tagged_commit, expected workflow commit $GITHUB_SHA" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Refusing to replace or modify an existing release." >&2
            exit 1
          fi

          artifact_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          gh release create "$GITHUB_REF_NAME" "$artifact" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Tideborne ${VERSION}" \
            --notes "Commit: ${GITHUB_SHA}\nArtifact: tideborne-${VERSION}.jar\nSHA-256: ${artifact_sha}" \
            --generate-notes

          {
            echo "## Published Tideborne ${VERSION}"
            echo ""
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- artifact: \`tideborne-${VERSION}.jar\`"
            echo "- SHA-256: \`${artifact_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
