name: Build Tideborne

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
      - reconstruct-1.3.57
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch exact external compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev/libs

          fetch_modrinth_primary() {
            local project_id="$1"
            local version_id="$2"
            local output="$3"
            local json url
            json="$(curl -fsSL "https://api.modrinth.com/v2/version/${version_id}")"
            test "$(printf '%s' "$json" | jq -r '.project_id')" = "$project_id"
            url="$(printf '%s' "$json" | jq -r '.files[] | select(.primary == true) | .url' | head -n1)"
            test -n "$url"
            curl -fsSL "$url" -o "$output"
          }

          # Tide 2.1.1 Fabric for Minecraft 1.21.1. Resolve the exact published
          # Modrinth version by name/platform rather than compiling against 2.1.
          tide_json="$(curl -fsSLG \
            --data-urlencode 'game_versions=["1.21.1"]' \
            --data-urlencode 'loaders=["fabric"]' \
            --data-urlencode 'include_changelog=false' \
            'https://api.modrinth.com/v2/project/die1AF7i/version')"
          tide_version_id="$(printf '%s' "$tide_json" | jq -r '[.[] | select(.name == "Tide 2.1.1 (Fabric 1.21.1)")][0].id // empty')"
          tide_url="$(printf '%s' "$tide_json" | jq -r '[.[] | select(.name == "Tide 2.1.1 (Fabric 1.21.1)")][0].files[] | select(.primary == true) | .url' | head -n1)"
          test -n "$tide_version_id"
          test -n "$tide_url"
          curl -fsSL "$tide_url" -o dev/libs/tide-fabric-1.21.1-2.1.1.jar
          tide_sha="$(sha256sum dev/libs/tide-fabric-1.21.1-2.1.1.jar | awk '{print $1}')"
          tide_mod_version="$(unzip -p dev/libs/tide-fabric-1.21.1-2.1.1.jar fabric.mod.json | jq -r '.version')"
          test "$tide_mod_version" = '2.1.1'
          echo "Tide 2.1.1 Modrinth version: $tide_version_id"
          echo "Tide 2.1.1 SHA-256: $tide_sha"

          # Apex Waters 1.1.1 Fabric 1.21.1, exact upstream GitHub release asset.
          curl -fsSL \
            'https://github.com/acorsicanfrog/apexwaters/releases/download/1.1.1/apexwaters-1.21.1-fabric-1.1.1.jar' \
            -o dev/libs/apex-waters-fabric-1.21.1-1.1.1.jar
          echo '00f1c5eaf5b7c2e79a2c64cdeac1a89f2430b2c9ab5f56043f148bde170dba37  dev/libs/apex-waters-fabric-1.21.1-1.1.1.jar' \
            | sha256sum --check --strict

          # Myths of the Sea 1.3.0 Fabric 1.21.1 and the exact compatible dependency
          # versions frozen for the optional-mod regression matrix.
          fetch_modrinth_primary 'WaCchT6K' '3UawtEXr' \
            dev/libs/myths-of-the-sea-fabric-1.21.1-1.3.0.jar
          test "$(unzip -p dev/libs/myths-of-the-sea-fabric-1.21.1-1.3.0.jar fabric.mod.json | jq -r '.id')" = 'myths_of_the_sea'
          test "$(unzip -p dev/libs/myths-of-the-sea-fabric-1.21.1-1.3.0.jar fabric.mod.json | jq -r '.version')" = '1.3.0'

          fetch_modrinth_primary 'GkIc6rRo' 'kxmVyCru' \
            dev/libs/cerbons-api-fabric-1.21.1-1.3.0.jar
          fetch_modrinth_primary '8BmcQJ2H' 'dnJdtm0u' \
            dev/libs/geckolib-fabric-1.21.1-4.9.2.jar

          echo "Myths of the Sea 1.3.0 SHA-256: $(sha256sum dev/libs/myths-of-the-sea-fabric-1.21.1-1.3.0.jar | awk '{print $1}')"
          echo "CERBON API 1.3.0 SHA-256: $(sha256sum dev/libs/cerbons-api-fabric-1.21.1-1.3.0.jar | awk '{print $1}')"
          echo "GeckoLib 4.9.2 SHA-256: $(sha256sum dev/libs/geckolib-fabric-1.21.1-4.9.2.jar | awk '{print $1}')"

          # Loom 1.10 validates the producer Loom version for jars that request
          # static mixin remapping. The exact Myths stack was published by newer
          # Loom, but its intermediary bytecode/class tweakers still need Loom's
          # normal remapper for this named GameTest runtime. After verifying the
          # exact upstream artifacts above, remove only the producer-version
          # manifest attribute in ephemeral CI copies. Every non-manifest entry
          # remains byte-for-byte identical and the static-remap request remains.
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import zipfile
          from pathlib import Path

          jars = [
              Path('dev/libs/myths-of-the-sea-fabric-1.21.1-1.3.0.jar'),
              Path('dev/libs/cerbons-api-fabric-1.21.1-1.3.0.jar'),
              Path('dev/libs/geckolib-fabric-1.21.1-4.9.2.jar'),
          ]
          supported = (1, 10)

          for jar in jars:
              with zipfile.ZipFile(jar, 'r') as zin:
                  infos = zin.infolist()
                  payloads = {info.filename: zin.read(info.filename) for info in infos}

              manifest_name = 'META-INF/MANIFEST.MF'
              manifest = payloads.get(manifest_name)
              if manifest is None:
                  print(f'{jar}: no manifest, no Loom metadata sanitization needed')
                  continue

              text = manifest.decode('utf-8')
              loom_match = re.search(r'(?im)^Fabric-Loom-Version:\s*([^\r\n]+)', text)
              remap_match = re.search(r'(?im)^Fabric-Loom-Mixin-Remap-Type:\s*([^\r\n]+)', text)
              if not loom_match or not remap_match or remap_match.group(1).strip().lower() != 'static':
                  print(f'{jar}: no newer static-remap Loom metadata to sanitize')
                  continue

              version = loom_match.group(1).strip()
              numeric = tuple(int(part) for part in version.split('.')[:2])
              if numeric <= supported:
                  print(f'{jar}: producer Loom {version} is compatible with Loom 1.10')
                  continue

              rewritten = re.sub(
                  r'(?im)^Fabric-Loom-Version:[^\r\n]*(?:\r\n|\n|\r)?',
                  '',
                  text,
                  count=1,
              ).encode('utf-8')
              payloads[manifest_name] = rewritten
              original_non_manifest = {
                  name: hashlib.sha256(data).digest()
                  for name, data in payloads.items()
                  if name != manifest_name
              }

              tmp = jar.with_suffix(jar.suffix + '.tmp')
              with zipfile.ZipFile(tmp, 'w') as zout:
                  for info in infos:
                      zout.writestr(info, payloads[info.filename])
              os.replace(tmp, jar)

              with zipfile.ZipFile(jar, 'r') as check:
                  for name, digest in original_non_manifest.items():
                      if hashlib.sha256(check.read(name)).digest() != digest:
                          raise RuntimeError(f'{jar}: non-manifest entry changed: {name}')
                  check_manifest = check.read(manifest_name).decode('utf-8')
                  if re.search(r'(?im)^Fabric-Loom-Version:', check_manifest):
                      raise RuntimeError(f'{jar}: Fabric-Loom-Version was not removed')
                  if not re.search(r'(?im)^Fabric-Loom-Mixin-Remap-Type:\s*static\s*$', check_manifest):
                      raise RuntimeError(f'{jar}: static mixin remap request was not preserved')

              print(f'{jar}: sanitized producer Loom {version} metadata for Loom 1.10 QA remapping')
          PY

      - name: Validate reconstruction identifiers
        shell: bash
        run: |
          if [ -d src/main/java ]; then
            if grep -R -n -E '\b(class|method|field)_[0-9]+' src/main/java; then
              echo 'Unresolved Minecraft intermediary identifiers remain in maintained Java source.'
              exit 1
            fi
          fi

      - name: Build
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew clean build --stacktrace
          else
            gradle clean build --stacktrace
          fi

      - name: Run GameTests with no optional compatibility mods
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew runGametest --stacktrace
          else
            gradle runGametest --stacktrace
          fi

      - name: Run GameTests with Apex Waters 1.1.1 only
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew runGametest -PincludeApexRuntime=true --stacktrace
          else
            gradle runGametest -PincludeApexRuntime=true --stacktrace
          fi

      - name: Run GameTests with Myths of the Sea 1.3.0 only
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew runGametest -PincludeMythsRuntime=true --stacktrace
          else
            gradle runGametest -PincludeMythsRuntime=true --stacktrace
          fi

      - name: Run GameTests with Apex Waters and Myths of the Sea
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew runGametest -PincludeApexRuntime=true -PincludeMythsRuntime=true --stacktrace
          else
            gradle runGametest -PincludeApexRuntime=true -PincludeMythsRuntime=true --stacktrace
          fi

      - name: Upload built JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tideborne-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
