name: One-shot Tideborne package ownership cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/package-ownership-cleanup.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Guard dev only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git branch --show-current)" = "dev"
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch exact external compile dependencies
        run: bash scripts/fetch_ci_dependencies.sh

      - name: Migrate Java ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          from pathlib import Path

          ROOT = Path.cwd()
          SRC_ROOTS = [ROOT / "src/main/java", ROOT / "src/test/java"]
          OLD_ROOTS = (
              "com.redslovesgames.tidetraits",
              "com.redslovesgames.tideteamjournal",
              "com.redslovesgames.tideboundcompatibility",
          )
          V2_ROOT = "com.redslovesgames.tideborne.fishing.v2"

          type_re = re.compile(r"(?m)^(?:public\s+)?(?:final\s+|abstract\s+|sealed\s+|non-sealed\s+)?(?:class|record|interface|enum)\s+(\w+)")
          package_re = re.compile(r"(?m)^package\s+([\w.]+);")

          def cls_base(name: str) -> str:
              for suffix in ("GameTests", "Tests", "Test"):
                  if name.endswith(suffix):
                      return name[:-len(suffix)]
              return name

          def v2_root_target(cls: str) -> str:
              base = cls_base(cls)
              if cls == "FreshWorldRegressionGameTests":
                  return "com.redslovesgames.tideborne.fishing.gametest"
              if base == "LegacyFishMigrationService":
                  return "com.redslovesgames.tideborne.migration.legacy"

              gear_tokens = (
                  "Gear", "Leader", "Bait", "Bobber", "Hook", "Rod", "Line", "Leviathan"
              )
              specimen_tokens = (
                  "Specimen", "Trait", "BodyType", "Condition", "Pigmentation", "Quality",
                  "FishScore", "SizeDistribution", "NormalDistribution", "Percentile", "PerfectCatch"
              )
              if any(token in base for token in gear_tokens):
                  return "com.redslovesgames.tideborne.fishing.gear"
              if any(token in base for token in specimen_tokens):
                  return "com.redslovesgames.tideborne.fishing.specimen"
              return "com.redslovesgames.tideborne.fishing"

          def v2_integration_target(cls: str) -> str:
              base = cls_base(cls)
              if base in {
                  "JournalSpecimenNetworkCodec", "JournalSpecimenStore", "CanonicalSpecimenRecordIndexer"
              }:
                  return "com.redslovesgames.tideborne.journal"
              if base.startswith("Legacy"):
                  return "com.redslovesgames.tideborne.migration.legacy"
              if base in {
                  "TideFishingContextAdapter", "TideSpeciesProfileAdapter", "TideSpeciesSelectionBridge",
                  "CrateFishProgressionBridge"
              }:
                  return "com.redslovesgames.tideborne.fishing.tide"
              if base in {
                  "CanonicalCatchStateManager", "CanonicalSpecimenStorage", "CatchSeedDeriver"
              }:
                  return "com.redslovesgames.tideborne.fishing.specimen"
              if cls.endswith("GameTests"):
                  return "com.redslovesgames.tideborne.fishing.gametest"
              return "com.redslovesgames.tideborne.fishing"

          def target_package(pkg: str, cls: str) -> str:
              if pkg == "com.redslovesgames.tideborne.migration":
                  return "com.redslovesgames.tideborne.migration.legacy"

              if pkg == V2_ROOT:
                  return v2_root_target(cls)
              if pkg.startswith(V2_ROOT + "."):
                  tail = pkg[len(V2_ROOT) + 1:]
                  if tail == "integration":
                      return v2_integration_target(cls)
                  if tail.startswith("gametest"):
                      suffix = tail[len("gametest"):]
                      return "com.redslovesgames.tideborne.fishing.gametest" + suffix
                  if tail.startswith("debug"):
                      suffix = tail[len("debug"):]
                      return "com.redslovesgames.tideborne.fishing.debug" + suffix
                  if tail.startswith("simulation"):
                      suffix = tail[len("simulation"):]
                      return "com.redslovesgames.tideborne.fishing.simulation" + suffix
                  return "com.redslovesgames.tideborne.fishing." + tail

              if pkg == "com.redslovesgames.tidetraits":
                  return "com.redslovesgames.tideborne.fishing"
              if pkg.startswith("com.redslovesgames.tidetraits."):
                  tail = pkg[len("com.redslovesgames.tidetraits."):]
                  if tail == "catching" or tail.startswith("catching."):
                      suffix = tail[len("catching"):]
                      return "com.redslovesgames.tideborne.fishing.specimen" + suffix
                  if tail == "trait" or tail.startswith("trait."):
                      suffix = tail[len("trait"):]
                      return "com.redslovesgames.tideborne.fishing.specimen" + suffix
                  if tail == "fish" or tail.startswith("fish."):
                      suffix = tail[len("fish"):]
                      return "com.redslovesgames.tideborne.fishing.specimen" + suffix
                  if tail == "entity" or tail.startswith("entity."):
                      suffix = tail[len("entity"):]
                      return "com.redslovesgames.tideborne.fishing.specimen" + suffix
                  if tail == "component" or tail.startswith("component."):
                      suffix = tail[len("component"):]
                      return "com.redslovesgames.tideborne.registry" + suffix
                  if tail == "discovery" or tail.startswith("discovery."):
                      suffix = tail[len("discovery"):]
                      return "com.redslovesgames.tideborne.discovery" + suffix
                  if tail == "compat.multiplayer" or tail.startswith("compat.multiplayer."):
                      suffix = tail[len("compat.multiplayer"):]
                      return "com.redslovesgames.tideborne.discovery.multiplayer" + suffix
                  if tail == "satchel" or tail.startswith("satchel."):
                      suffix = tail[len("satchel"):]
                      return "com.redslovesgames.tideborne.satchel" + suffix
                  if tail == "client.gui.journal" or tail.startswith("client.gui.journal."):
                      suffix = tail[len("client.gui.journal"):]
                      return "com.redslovesgames.tideborne.journal.client" + suffix
                  if tail == "client.gui.satchel" or tail.startswith("client.gui.satchel."):
                      suffix = tail[len("client.gui.satchel"):]
                      return "com.redslovesgames.tideborne.satchel.client" + suffix
                  if tail == "client.render" or tail.startswith("client.render."):
                      suffix = tail[len("client.render"):]
                      return "com.redslovesgames.tideborne.presentation.render" + suffix
                  if tail == "client" or tail.startswith("client."):
                      suffix = tail[len("client"):]
                      return "com.redslovesgames.tideborne.presentation.client" + suffix
                  if tail == "command" or tail.startswith("command."):
                      suffix = tail[len("command"):]
                      return "com.redslovesgames.tideborne.command" + suffix
                  if tail == "config" or tail.startswith("config."):
                      suffix = tail[len("config"):]
                      return "com.redslovesgames.tideborne.config" + suffix
                  if tail == "network" or tail.startswith("network."):
                      suffix = tail[len("network"):]
                      return "com.redslovesgames.tideborne.network" + suffix
                  if tail == "registry" or tail.startswith("registry."):
                      suffix = tail[len("registry"):]
                      return "com.redslovesgames.tideborne.registry" + suffix
                  if tail == "gametest" or tail.startswith("gametest."):
                      suffix = tail[len("gametest"):]
                      return "com.redslovesgames.tideborne.fishing.gametest" + suffix
                  if tail == "mixin.client" or tail.startswith("mixin.client."):
                      suffix = tail[len("mixin.client"):]
                      return "com.redslovesgames.tideborne.mixin.specimen.client" + suffix
                  if tail == "mixin" or tail.startswith("mixin."):
                      suffix = tail[len("mixin"):]
                      return "com.redslovesgames.tideborne.mixin.specimen" + suffix
                  if tail == "resource" or tail.startswith("resource."):
                      suffix = tail[len("resource"):]
                      return "com.redslovesgames.tideborne.presentation.resource" + suffix
                  if tail == "data" or tail.startswith("data."):
                      suffix = tail[len("data"):]
                      return "com.redslovesgames.tideborne.fishing.specimen.data" + suffix
                  if tail == "item" or tail.startswith("item."):
                      suffix = tail[len("item"):]
                      return "com.redslovesgames.tideborne.fishing.specimen.item" + suffix
                  if tail == "util" or tail.startswith("util."):
                      suffix = tail[len("util"):]
                      return "com.redslovesgames.tideborne.fishing.specimen.support" + suffix
                  raise SystemExit(f"Unclassified Tide Traits package: {pkg} ({cls})")

              if pkg == "com.redslovesgames.tideteamjournal":
                  return "com.redslovesgames.tideborne.journal"
              if pkg.startswith("com.redslovesgames.tideteamjournal."):
                  tail = pkg[len("com.redslovesgames.tideteamjournal."):]
                  if tail == "client" or tail.startswith("client."):
                      suffix = tail[len("client"):]
                      return "com.redslovesgames.tideborne.journal.client" + suffix
                  if tail == "mixin" or tail.startswith("mixin."):
                      suffix = tail[len("mixin"):]
                      return "com.redslovesgames.tideborne.mixin.journal" + suffix
                  return "com.redslovesgames.tideborne.journal." + tail

              if pkg == "com.redslovesgames.tideboundcompatibility":
                  return "com.redslovesgames.tideborne.compat"
              if pkg.startswith("com.redslovesgames.tideboundcompatibility."):
                  tail = pkg[len("com.redslovesgames.tideboundcompatibility."):]
                  if tail == "compat.apex" or tail.startswith("compat.apex."):
                      suffix = tail[len("compat.apex"):]
                      return "com.redslovesgames.tideborne.compat.apex" + suffix
                  if tail == "client" or tail.startswith("client."):
                      suffix = tail[len("client"):]
                      return "com.redslovesgames.tideborne.presentation.client" + suffix
                  if tail == "config" or tail.startswith("config."):
                      suffix = tail[len("config"):]
                      return "com.redslovesgames.tideborne.config" + suffix
                  if tail == "entity" or tail.startswith("entity."):
                      suffix = tail[len("entity"):]
                      return "com.redslovesgames.tideborne.ecosystem" + suffix
                  if tail == "fishing" or tail.startswith("fishing."):
                      suffix = tail[len("fishing"):]
                      if cls_base(cls) == "SharkCatchLoss":
                          return "com.redslovesgames.tideborne.ecosystem" + suffix
                      return "com.redslovesgames.tideborne.fishing.gear" + suffix
                  if tail == "item" or tail.startswith("item."):
                      suffix = tail[len("item"):]
                      if cls_base(cls) == "ChumBucketItem":
                          return "com.redslovesgames.tideborne.ecosystem" + suffix
                      return "com.redslovesgames.tideborne.fishing.gear" + suffix
                  if tail == "mixin.apex" or tail.startswith("mixin.apex."):
                      suffix = tail[len("mixin.apex"):]
                      return "com.redslovesgames.tideborne.mixin.compat.apex" + suffix
                  if tail == "mixin" or tail.startswith("mixin."):
                      suffix = tail[len("mixin"):]
                      return "com.redslovesgames.tideborne.mixin.tide" + suffix
                  if tail == "network" or tail.startswith("network."):
                      suffix = tail[len("network"):]
                      return "com.redslovesgames.tideborne.network" + suffix
                  if tail == "registry" or tail.startswith("registry."):
                      suffix = tail[len("registry"):]
                      return "com.redslovesgames.tideborne.registry" + suffix
                  return "com.redslovesgames.tideborne.compat." + tail

              return pkg

          java_files = []
          for src_root in SRC_ROOTS:
              if src_root.exists():
                  java_files.extend(sorted(src_root.rglob("*.java")))

          records = []
          fqcn_map = {}
          path_map = {}
          destinations = {}
          for path in java_files:
              text = path.read_text(encoding="utf-8")
              pm = package_re.search(text)
              tm = type_re.search(text)
              if not pm or not tm:
                  continue
              old_pkg = pm.group(1)
              cls = tm.group(1)
              new_pkg = target_package(old_pkg, cls)
              old_fqcn = old_pkg + "." + cls
              new_fqcn = new_pkg + "." + cls
              if new_fqcn in destinations and destinations[new_fqcn] != path:
                  raise SystemExit(f"Package migration collision: {new_fqcn}: {destinations[new_fqcn]} and {path}")
              destinations[new_fqcn] = path
              if new_pkg == old_pkg:
                  continue
              src_root = next(root for root in SRC_ROOTS if path.is_relative_to(root))
              new_path = src_root / Path(*new_pkg.split(".")) / path.name
              records.append((path, new_path, old_pkg, new_pkg, cls))
              fqcn_map[old_fqcn] = new_fqcn
              path_map[path.relative_to(ROOT).as_posix()] = new_path.relative_to(ROOT).as_posix()

          # Rewrite package declarations into destination files first, then delete old paths.
          for old_path, new_path, old_pkg, new_pkg, cls in records:
              text = old_path.read_text(encoding="utf-8")
              text = re.sub(
                  rf"(?m)^package\s+{re.escape(old_pkg)};",
                  f"package {new_pkg};",
                  text,
                  count=1,
              )
              new_path.parent.mkdir(parents=True, exist_ok=True)
              if new_path.exists() and new_path != old_path:
                  raise SystemExit(f"Destination already exists: {new_path}")
              new_path.write_text(text, encoding="utf-8")
          for old_path, new_path, *_ in records:
              if old_path != new_path:
                  old_path.unlink()

          # Update exact Java FQCN and source-path references across maintained UTF-8 text.
          skip_parts = {".git", ".gradle", "build", "run", "logs"}
          text_suffixes = {
              ".java", ".json", ".md", ".txt", ".yml", ".yaml", ".gradle", ".properties",
              ".sh", ".py", ".mcfunction", ".toml", ".xml"
          }
          replacements = sorted(
              list(fqcn_map.items()) + list(path_map.items()),
              key=lambda pair: len(pair[0]),
              reverse=True,
          )
          for path in ROOT.rglob("*"):
              if not path.is_file() or any(part in skip_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"AGENTS.md"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          # Keep historical mixin resource filenames, but point them at the new Java ownership.
          mixin_updates = {
              "tide_traits.mixins.json": ("com.redslovesgames.tideborne.mixin.specimen", None),
              "tide_traits.client.mixins.json": ("com.redslovesgames.tideborne.mixin.specimen.client", None),
              "tide_team_journal.mixins.json": ("com.redslovesgames.tideborne.mixin.journal", None),
              "tidebound_compatibility.mixins.json": ("com.redslovesgames.tideborne.mixin.tide", None),
              "tidebound_compatibility.apex.mixins.json": (
                  "com.redslovesgames.tideborne.mixin.compat.apex",
                  "com.redslovesgames.tideborne.mixin.tide.OptionalCompatMixinPlugin",
              ),
          }
          for name, (pkg, plugin) in mixin_updates.items():
              p = ROOT / "src/main/resources" / name
              data = json.loads(p.read_text(encoding="utf-8"))
              data["package"] = pkg
              if plugin is not None:
                  data["plugin"] = plugin
              p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          # Add an explicit Java-ownership architecture test. It checks package ownership only,
          # and intentionally ignores historical serialized namespace strings.
          arch = ROOT / "src/test/java/com/redslovesgames/tideborne/architecture/JavaPackageOwnershipArchitectureTest.java"
          arch.parent.mkdir(parents=True, exist_ok=True)
          arch.write_text('''package com.redslovesgames.tideborne.architecture;\n\nimport static org.junit.jupiter.api.Assertions.assertFalse;\nimport static org.junit.jupiter.api.Assertions.fail;\n\nimport java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.util.ArrayList;\nimport java.util.List;\nimport java.util.regex.Matcher;\nimport java.util.regex.Pattern;\nimport org.junit.jupiter.api.Test;\n\nclass JavaPackageOwnershipArchitectureTest {\n    private static final Path PRODUCTION_ROOT = Path.of("src/main/java");\n    private static final Pattern PACKAGE = Pattern.compile("(?m)^package\\\\s+([\\\\w.]+);");\n    private static final List<String> FORBIDDEN = List.of(\n            "com.redslovesgames.tidetraits",\n            "com.redslovesgames.tideteamjournal",\n            "com.redslovesgames.tideboundcompatibility",\n            "com.redslovesgames.tideborne.fishing.v2");\n\n    @Test\n    void activeProductionJavaUsesUnifiedTideborneOwnership() throws IOException {\n        List<String> violations = new ArrayList<>();\n        try (var paths = Files.walk(PRODUCTION_ROOT)) {\n            for (Path source : paths.filter(path -> path.toString().endsWith(".java")).toList()) {\n                String text = Files.readString(source);\n                Matcher matcher = PACKAGE.matcher(text);\n                if (!matcher.find()) {\n                    continue;\n                }\n                String declared = matcher.group(1);\n                for (String forbidden : FORBIDDEN) {\n                    if (declared.equals(forbidden) || declared.startsWith(forbidden + ".")) {\n                        violations.add(source + " -> " + declared);\n                    }\n                }\n                String normalized = source.toString().replace('\\\\', '/');\n                assertFalse(normalized.contains("/tideborne/fishing/v2/"), source.toString());\n            }\n        }\n        if (!violations.isEmpty()) {\n            fail("Forbidden Java ownership remains: " + violations);\n        }\n    }\n}\n''', encoding="utf-8")

          # Make the repository validator enforce the same production Java package boundary.
          validator = ROOT / "scripts/validate_repository.sh"
          validator_text = validator.read_text(encoding="utf-8")
          marker = "# Java package ownership guard"
          if marker not in validator_text:
              insertion = '''\n# Java package ownership guard\nif rg -n '^package com\\.redslovesgames\\.(tidetraits|tideteamjournal|tideboundcompatibility)(\\.|;)|^package com\\.redslovesgames\\.tideborne\\.fishing\\.v2(\\.|;)' src/main/java; then\n    echo 'Historical Java package ownership remains in active production source.' >&2\n    exit 1\nfi\nif find src/main/java/com/redslovesgames/tideborne/fishing -type d -path '*/v2*' -print -quit 2>/dev/null | grep -q .; then\n    echo 'Fishing v2 source path remains in active production source.' >&2\n    exit 1\nfi\n'''
              validator_text = validator_text.replace("python3 - <<'PY'\n", insertion + "\npython3 - <<'PY'\n", 1)
              validator.write_text(validator_text, encoding="utf-8")

          ownership_note = '''\n## Current Java package ownership\n\nAll active production Java is owned by `com.redslovesgames.tideborne.*`. Canonical fishing code uses `tideborne.fishing` and feature children such as `fishing.specimen`, `fishing.gear`, and `fishing.tide`; journal, satchel, discovery, ecosystem, compatibility, presentation, networking, registry, mixin, and legacy migration code use their corresponding Tideborne feature packages. Historical serialized identifiers and resource namespaces are intentionally unchanged.\n'''
          for rel in ("AGENTS.md", "docs/ARCHITECTURE.md", "docs/CURRENT_STATE.md", "docs/INDEX.md", "docs/TODO.md"):
              p = ROOT / rel
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              if "## Current Java package ownership" not in text:
                  p.write_text(text.rstrip() + "\n" + ownership_note, encoding="utf-8")

          # Remove empty historical Java directories.
          for base in (
              ROOT / "src/main/java/com/redslovesgames/tidetraits",
              ROOT / "src/main/java/com/redslovesgames/tideteamjournal",
              ROOT / "src/main/java/com/redslovesgames/tideboundcompatibility",
              ROOT / "src/main/java/com/redslovesgames/tideborne/fishing/v2",
              ROOT / "src/test/java/com/redslovesgames/tidetraits",
              ROOT / "src/test/java/com/redslovesgames/tideteamjournal",
              ROOT / "src/test/java/com/redslovesgames/tideboundcompatibility",
              ROOT / "src/test/java/com/redslovesgames/tideborne/fishing/v2",
          ):
              if base.exists():
                  for d in sorted((p for p in base.rglob("*") if p.is_dir()), reverse=True):
                      try:
                          d.rmdir()
                      except OSError:
                          pass
                  try:
                      base.rmdir()
                  except OSError:
                      pass

          forbidden_decl = re.compile(
              r"(?m)^package\s+(?:com\.redslovesgames\.(?:tidetraits|tideteamjournal|tideboundcompatibility)(?:\.|;)|com\.redslovesgames\.tideborne\.fishing\.v2(?:\.|;))"
          )
          violations = []
          for path in (ROOT / "src/main/java").rglob("*.java"):
              text = path.read_text(encoding="utf-8")
              if forbidden_decl.search(text):
                  violations.append(str(path))
              if "/tideborne/fishing/v2/" in path.as_posix():
                  violations.append(str(path))
          if violations:
              raise SystemExit("Forbidden production Java ownership remains: " + ", ".join(sorted(set(violations))))

          summary = {
              "java_files_moved_total": len(records),
              "java_files_moved_production": sum(1 for old, *_ in records if old.is_relative_to(ROOT / "src/main/java")),
              "java_files_moved_tests": sum(1 for old, *_ in records if old.is_relative_to(ROOT / "src/test/java")),
              "fqcn_references_updated": len(fqcn_map),
          }
          Path("/tmp/tideborne-package-cleanup-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          print(json.dumps(summary, indent=2))
          PY

      - name: Structural validation
        run: ./scripts/validate_repository.sh

      - name: Unit and architecture tests
        run: ./gradlew test --stacktrace

      - name: GameTests without optional mods
        run: ./gradlew runGametest --stacktrace

      - name: GameTests with Apex Waters
        run: ./gradlew runGametest -PincludeApexRuntime=true --stacktrace

      - name: GameTests with Myths of the Sea
        run: ./gradlew runGametest -PincludeMythsRuntime=true --stacktrace

      - name: GameTests with Apex Waters and Myths of the Sea
        run: ./gradlew runGametest -PincludeApexRuntime=true -PincludeMythsRuntime=true --stacktrace

      - name: Authoritative Java 21 build
        run: ./gradlew clean build --stacktrace

      - name: Validate release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '[:space:]')"
          ./scripts/validate_release_artifact.sh "build/libs/tideborne-${version}.jar"

      - name: Commit validated cleanup to dev
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/tideborne-package-cleanup-summary.json
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          rm .github/workflows/package-ownership-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "refactor: unify Tideborne Java package ownership"
          git push origin HEAD:dev
