name: P7 Temporary Compatibility Alias Validation

on:
  push:
    branches:
      - agent/p7-resources

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'chore: trigger P7.5 compatibility validation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm historical diagnostic function is an advertised compatibility surface
        shell: bash
        run: |
          set -euo pipefail
          test -f src/main/resources/data/tide_traits/function/test_tuna_mutations.mcfunction
          grep -Fq '/function tide_traits:test_tuna_mutations' src/main/resources/TIDE_TRAITS_LITERAL_OVERLAY_V3.txt
          grep -Fq 'tide_traits:mutation="albino"' src/main/resources/data/tide_traits/function/test_tuna_mutations.mcfunction
      - name: Apply P7.5 compatibility cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/main/resources/data/tideborne/function
          cp src/main/resources/data/tide_traits/function/test_tuna_mutations.mcfunction \
             src/main/resources/data/tideborne/function/test_tuna_mutations.mcfunction
          printf 'function tideborne:test_tuna_mutations\n' > \
             src/main/resources/data/tide_traits/function/test_tuna_mutations.mcfunction

          cat > .github/TIDEBORNE_P7_COMPATIBILITY_ALIASES.md <<'DOC'
          # P7.5 Compatibility Alias Audit

          Branch: `agent/p7-resources`

          Baseline: `b2ea30d927c4bae15f2e9ccbdc48b61331ead9f4`

          P7 separates current resource ownership from persisted or externally addressable identity. Current presentation and Tide-owned flat data live under Tideborne ownership. Historical namespaces remain only where Minecraft, Fabric, saved data, network peers, datapacks, recipes, tags, registry identity, or an explicitly published command path can observe the old identifier.

          ## `tide_traits`

          Retained runtime resource surface:

          - `assets/tide_traits/lang/en_us.json`: automatic `item.tide_traits.anglers_satchel` naming plus translations for the eight historical public exclusion tags.
          - `assets/tide_traits/models/item/anglers_satchel*.json`: four model aliases required by the persisted item ID `tide_traits:anglers_satchel`. Their physical textures are Tideborne-owned.
          - `data/tide_traits/recipe/anglers_satchel.json`: retained as recipe ID `tide_traits:anglers_satchel`; recipe IDs are externally addressable.
          - `data/tide_traits/tags/item/*_excluded.json`: eight public datapack extension tags retained at their historical IDs.
          - `data/tide_traits/function/test_tuna_mutations.mcfunction`: retained as a one-line compatibility alias because the packaged historical note `TIDE_TRAITS_LITERAL_OVERLAY_V3.txt` explicitly advertised `/function tide_traits:test_tuna_mutations`. The actual diagnostic implementation now lives at `data/tideborne/function/test_tuna_mutations.mcfunction`.
          - `fabric.mod.json` provides `tide_traits`: retained so dependencies written against the historical internal-mod ID continue to resolve Tideborne.

          Historical non-resource identities also remain in Java where compatibility requires them, including the Satchel item/component family, specimen/discovery payload or persistence identifiers, and the `tide_traits:mutation_textures` reload-listener ID. P8 owns centralization of those identifiers; P7 does not rename them.

          ## `tide_team_journal`

          No `assets/tide_team_journal` or `data/tide_team_journal` resource tree remains. Current journal presentation lives under Tideborne assets and Tideborne translation keys.

          The historical `tide_team_journal` Fabric `provides` alias remains for dependency compatibility. Journal network and persistence IDs using this namespace are compatibility identities and are intentionally deferred to P8.

          ## `tidebound_compatibility`

          Retained runtime resource surface:

          - `assets/tidebound_compatibility/lang/en_us.json`: automatic historical item names/descriptions plus translations for retained public tag IDs.
          - `assets/tidebound_compatibility/models/item/*.json`: historical model aliases required by persisted `tidebound_compatibility:*` item IDs. Physical textures are Tideborne-owned.
          - `data/tidebound_compatibility/recipe/*.json`: eleven historical recipe IDs retained unchanged because recipes are externally addressable.
          - `data/tidebound_compatibility/tags/item/*.json`: eight public/historical integration tags retained unchanged for datapacks and optional integrations.
          - `fabric.mod.json` provides `tidebound_compatibility`: retained for dependency checks against the historical internal-mod ID.

          Current Leviathan bait and rod-accessory flat data do not live here. P7.2 moved the bundled records to `data/tideborne/bait` and `data/tideborne/rod_accessories`. Tide 2.1.1 scans those directories across namespaces, so third-party packs using the historical namespace remain loadable without duplicate bundled records.

          Historical item, entity, payload, config-file, and other persisted/runtime IDs using `tidebound_compatibility:*` remain compatibility identities. P8 owns their centralization and any future migration strategy.

          ## Non-historical foreign namespaces intentionally retained

          - `assets/tide/**`: upstream Tide renderer extension textures. Tide owns the lookup path.
          - `data/tide/**`: upstream Tide tag extension points.
          - `data/myths_of_the_sea/**`: optional Myths of the Sea integration resources.
          - `data/c/**`: common interoperability tags.
          - `data/minecraft/**`: vanilla-owned extension points.

          These are not compatibility aliases and must not be folded into `tideborne` for cosmetic uniformity.

          ## P7.5 invariant

          Historical asset namespaces are alias-only. Historical data namespaces contain only externally observable compatibility surfaces: recipes, tags, and the published diagnostic-function forwarding alias. No current presentation texture, current UI translation family, Tide flat-data record, dynamic mutation texture, mixin config, or general refmap remains historically owned.
          DOC

          mkdir -p src/test/java/com/redslovesgames/tideborne/assets
          cat > src/test/java/com/redslovesgames/tideborne/assets/CompatibilityAliasOwnershipTest.java <<'JAVA'
          package com.redslovesgames.tideborne.assets;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.Set;
          import java.util.stream.Collectors;
          import org.junit.jupiter.api.Test;

          class CompatibilityAliasOwnershipTest {
              private static final Path RESOURCES = Path.of("src/main/resources");
              private static final Path ASSETS = RESOURCES.resolve("assets");
              private static final Path DATA = RESOURCES.resolve("data");

              @Test
              void historicalAssetNamespacesAreAliasOnly() throws IOException {
                  assertEquals(Set.of("lang", "models"), childNames(ASSETS.resolve("tide_traits")));
                  assertEquals(Set.of("lang", "models"), childNames(ASSETS.resolve("tidebound_compatibility")));
                  assertFalse(Files.exists(ASSETS.resolve("tide_team_journal")));
                  assertEquals(4, regularFileCount(ASSETS.resolve("tide_traits/models/item")));
                  assertEquals(13, regularFileCount(ASSETS.resolve("tidebound_compatibility/models/item")));

                  String traitsLang = Files.readString(ASSETS.resolve("tide_traits/lang/en_us.json"));
                  assertTrue(traitsLang.contains("\"item.tide_traits.anglers_satchel\""));
                  assertFalse(traitsLang.contains("\"message.tide_traits."));
                  assertFalse(traitsLang.contains("\"tooltip.tide_traits."));

                  String fishingLang = Files.readString(ASSETS.resolve("tidebound_compatibility/lang/en_us.json"));
                  assertTrue(fishingLang.contains("\"item.tidebound_compatibility.leviathan_bait\""));
                  assertFalse(fishingLang.contains("\"message.tidebound_compatibility."));
                  assertFalse(fishingLang.contains("\"tooltip.tidebound_compatibility."));
                  assertFalse(fishingLang.contains("\"toast.tidebound_compatibility."));
                  assertFalse(fishingLang.contains("\"key.tidebound_compatibility."));
              }

              @Test
              void historicalDataNamespacesContainOnlyCompatibilitySurfaces() throws IOException {
                  assertEquals(Set.of("function", "recipe", "tags"), childNames(DATA.resolve("tide_traits")));
                  assertEquals(Set.of("recipe", "tags"), childNames(DATA.resolve("tidebound_compatibility")));
                  assertEquals(Set.of("anglers_satchel.json"), childNames(DATA.resolve("tide_traits/recipe")));
                  assertEquals(8, regularFileCount(DATA.resolve("tide_traits/tags/item")));
                  assertEquals(11, regularFileCount(DATA.resolve("tidebound_compatibility/recipe")));
                  assertEquals(8, regularFileCount(DATA.resolve("tidebound_compatibility/tags/item")));
              }

              @Test
              void historicalDiagnosticFunctionIsOnlyAForwardingAlias() throws IOException {
                  Path alias = DATA.resolve("tide_traits/function/test_tuna_mutations.mcfunction");
                  Path canonical = DATA.resolve("tideborne/function/test_tuna_mutations.mcfunction");
                  assertEquals("function tideborne:test_tuna_mutations\n", Files.readString(alias));
                  String body = Files.readString(canonical);
                  assertEquals(7, body.lines().filter(line -> line.startsWith("give @s tide:tuna[")).count());
                  assertTrue(body.contains("tide_traits:mutation=\"albino\""));
                  assertTrue(body.contains("tide_traits:mutation_seed=707"));
              }

              @Test
              void historicalModIdsRemainExplicitFabricCompatibilityAliases() throws IOException {
                  String fabric = Files.readString(RESOURCES.resolve("fabric.mod.json"));
                  assertTrue(fabric.contains("\"tide_traits\""));
                  assertTrue(fabric.contains("\"tide_team_journal\""));
                  assertTrue(fabric.contains("\"tidebound_compatibility\""));
                  assertTrue(fabric.contains("\"id\": \"tideborne\""));
              }

              @Test
              void foreignExtensionNamespacesRemainPresent() {
                  assertTrue(Files.isDirectory(ASSETS.resolve("tide")));
                  assertTrue(Files.isDirectory(DATA.resolve("tide")));
                  assertTrue(Files.isDirectory(DATA.resolve("myths_of_the_sea")));
                  assertTrue(Files.isDirectory(DATA.resolve("c")));
                  assertTrue(Files.isDirectory(DATA.resolve("minecraft")));
              }

              private static Set<String> childNames(Path directory) throws IOException {
                  try (var entries = Files.list(directory)) {
                      return entries.map(path -> path.getFileName().toString()).collect(Collectors.toSet());
                  }
              }

              private static long regularFileCount(Path directory) throws IOException {
                  try (var entries = Files.list(directory)) {
                      return entries.filter(Files::isRegularFile).count();
                  }
              }
          }
          JAVA
      - name: Validate P7.5 alias boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/main/resources/assets/tide_team_journal
          test "$(cat src/main/resources/data/tide_traits/function/test_tuna_mutations.mcfunction)" = 'function tideborne:test_tuna_mutations'
          test -f src/main/resources/data/tideborne/function/test_tuna_mutations.mcfunction
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = Path('src/main/resources')
          names = lambda path: {p.name for p in path.iterdir()}
          assert names(r/'assets/tide_traits') == {'lang', 'models'}
          assert names(r/'assets/tidebound_compatibility') == {'lang', 'models'}
          assert names(r/'data/tide_traits') == {'function', 'recipe', 'tags'}
          assert names(r/'data/tidebound_compatibility') == {'recipe', 'tags'}
          assert len(list((r/'data/tide_traits/recipe').glob('*.json'))) == 1
          assert len(list((r/'data/tide_traits/tags/item').glob('*.json'))) == 8
          assert len(list((r/'data/tidebound_compatibility/recipe').glob('*.json'))) == 11
          assert len(list((r/'data/tidebound_compatibility/tags/item').glob('*.json'))) == 8
          fabric = json.loads((r/'fabric.mod.json').read_text())
          assert fabric['id'] == 'tideborne'
          assert {'tide_traits','tide_team_journal','tidebound_compatibility'} <= set(fabric['provides'])
          print('P7.5 static compatibility boundary passed')
          PY
          git diff --check
      - name: Fetch exact external compile dependencies
        run: bash scripts/fetch_ci_dependencies.sh
      - name: Run focused Java 21 tests and package resources
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew test \
            --tests com.redslovesgames.tideborne.assets.CompatibilityAliasOwnershipTest \
            --tests com.redslovesgames.tideborne.assets.DataResourceOwnershipTest \
            --tests com.redslovesgames.tideborne.fishing.FishingGearRegistryTest \
            remapJar
          VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/tideborne-${VERSION}.jar"
          test -f "$JAR"
          unzip -p "$JAR" data/tide_traits/function/test_tuna_mutations.mcfunction | grep -Fxq 'function tideborne:test_tuna_mutations'
          unzip -p "$JAR" data/tideborne/function/test_tuna_mutations.mcfunction | grep -Fq 'tide_traits:mutation="albino"'
          ./scripts/validate_release_artifact.sh "$JAR"
      - name: Commit validated P7.5 product change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p7-temp-compatibility-alias-validation.yml
          rm -f .github/P7_5_VALIDATION_TRIGGER
          git config user.name "RedsLovesGames"
          git config user.email "75150137+RedsLovesGames@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "resources: finalize compatibility alias boundary"
          git push origin HEAD:agent/p7-resources
