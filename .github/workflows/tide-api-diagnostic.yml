name: Tide API Diagnostic

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/tide-api-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect published Tide 2.1.1 Angling Table API
        shell: bash
        run: |
          set -euo pipefail
          tide_json="$(curl -fsSLG \
            --data-urlencode 'game_versions=["1.21.1"]' \
            --data-urlencode 'loaders=["fabric"]' \
            --data-urlencode 'include_changelog=false' \
            'https://api.modrinth.com/v2/project/die1AF7i/version')"
          tide_url="$(printf '%s' "$tide_json" | jq -r '[.[] | select(.name == "Tide 2.1.1 (Fabric 1.21.1)")][0].files[] | select(.primary == true) | .url' | head -n1)"
          test -n "$tide_url"
          curl -fsSL "$tide_url" -o tide.jar
          for cls in \
            com.li64.tide.client.gui.menus.AnglingTableMenu \
            com.li64.tide.client.gui.screens.AnglingTableScreen \
            com.li64.tide.data.rods.CustomRodManager \
            com.li64.tide.data.TideTags\$Items \
            com.li64.tide.registries.entities.misc.fishing.TideFishingHook; do
            echo "=== ${cls} ==="
            javap -classpath tide.jar -p -s "$cls"
          done
