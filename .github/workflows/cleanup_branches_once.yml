name: One-shot branch cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cleanup_branches_once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            'agent/p2-initialization'
            'agent/p3-config'
            'agent/p4-consolidation'
            'agent/p5-legacy-specimen'
            'agent/p6-feature-reownership'
            'agent/p7-resources'
            'agent/p8-legacy-ids'
            'agent/p9-final-audit'
            'dev-release-temp'
            'reconstruct-1.3.57'
            'scratch/depths-ui-0.9.0-build'
            'scratch/depths-ui-dev'
            'stage-6-body-type-runtime'
            'task/immutable-release-real-balance-20260901'
          )

          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

          echo 'Remaining heads:'
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/" --jq '.[].ref'
