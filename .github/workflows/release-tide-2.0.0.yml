name: Publish tide 2.0.0

on:
  push:
    branches:
      - dev

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'release: publish tide 2.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for validated 2.0.0 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 33273422091 --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Download validated JAR artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download 33273422091 \
            --repo "$GITHUB_REPOSITORY" \
            --name "tideborne-6b81539a227c61bba84b8703201e14c0727a9aeb" \
            --dir release-assets
          test -f release-assets/tideborne-2.0.0.jar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create tide-2.0.0 \
            release-assets/tideborne-2.0.0.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target 6b81539a227c61bba84b8703201e14c0727a9aeb \
            --title "tide 2.0.0" \
            --notes "Fishing System 2.0 release built and validated from the dev branch."
