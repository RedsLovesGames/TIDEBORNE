name: P7 Temporary Refmap Diagnostic

on:
  push:
    branches:
      - agent/p7-resources

jobs:
  inspect:
    if: "${{ github.event.head_commit.message == 'chore: inspect P7.4 Loom refmap output' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact external compile dependencies
        run: bash scripts/fetch_ci_dependencies.sh
      - name: Reuse P7.4 transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/p7-temp-mixin-metadata-validation-rerun.yml').read_text().splitlines()
          start = workflow.index('      - name: Consolidate Tideborne mixin metadata')
          run_line = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(workflow)) if workflow[i].startswith('      - name: '))
          body = []
          for line in workflow[run_line + 1:end]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif not line.strip():
                  body.append('')
              else:
                  raise SystemExit(f'Unexpected indentation: {line!r}')
          Path('/tmp/p7_4_transform.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/p7_4_transform.sh
      - name: Build remapped production jar
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean remapJar
      - name: Inspect source, processed, and remapped refmaps
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F= '$1 == "mod_version" {print $2}' gradle.properties | tr -d '[:space:]')"
          JAR="build/libs/tideborne-${VERSION}.jar"
          echo '=== Source client mixin config ==='
          cat src/main/resources/tideborne.client.mixins.json
          echo '=== Processed client mixin config ==='
          cat build/resources/main/tideborne.client.mixins.json
          echo '=== Remapped JAR client mixin config ==='
          unzip -p "$JAR" tideborne.client.mixins.json
          echo
          echo '=== Remapped JAR mixin/refmap root entries ==='
          unzip -Z1 "$JAR" | grep -E '(^|/)([^/]*mixins\.json|[^/]*refmap\.json)$' | sort
          echo '=== Refmap summaries ==='
          python3 - "$JAR" <<'PY'
          import json, sys, zipfile
          jar_path=sys.argv[1]
          with zipfile.ZipFile(jar_path) as jar:
              names=set(jar.namelist())
              for name in sorted(n for n in names if n.endswith('refmap.json') and '/' not in n):
                  data=json.loads(jar.read(name))
                  print(f'[{name}]')
                  for section_name, section in (
                      ('mappings', data.get('mappings', {})),
                      ('named:intermediary', data.get('data', {}).get('named:intermediary', {})),
                  ):
                      print(section_name, 'keys=', len(section))
                      for key in sorted(section):
                          print(' ', key, '=>', json.dumps(section[key], sort_keys=True))
          PY
