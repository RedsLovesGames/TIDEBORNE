name: Deploy Tideborne Field Guide to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'docs/wiki/**'
      - 'site/**'
      - 'src/main/resources/data/**/recipe/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout dev
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Restore pinned fish renders
        uses: actions/cache@v4
        with:
          path: site/public/fish/renders
          key: ${{ runner.os }}-tideborne-fish-renders-${{ hashFiles('site/src/data/generated/fish.json') }}

      - name: Install website dependencies
        run: npm ci

      - name: Run website tests
        run: npm test -- --passWithNoTests

      - name: Build Field Guide
        run: npm run build

      - name: Validate built routes and links
        run: npm run validate:build

      - name: Verify Pages output
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/TIDEBORNE/' dist/index.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
