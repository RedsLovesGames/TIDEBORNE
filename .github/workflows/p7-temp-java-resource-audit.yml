name: P7 Temporary Java Resource Validation

on:
  push:
    branches:
      - agent/p7-resources

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'chore: stage P7.3 Java resource validation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact external compile dependencies
        shell: bash
        run: bash scripts/fetch_ci_dependencies.sh
      - name: Apply P7.3 current-runtime identifier migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          rendering = Path('src/main/java/com/redslovesgames/tideborne/presentation/render/MutationRendering.java')
          text = rendering.read_text(encoding='utf-8')
          old = 'return "tide_traits".equals(texture.getNamespace()) && texture.getPath().startsWith("dynamic/mutation/");'
          new = 'return "tideborne".equals(texture.getNamespace()) && texture.getPath().startsWith("dynamic/mutation/");'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one generated-texture namespace check, found {text.count(old)}')
          rendering.write_text(text.replace(old, new), encoding='utf-8')

          cache = Path('src/main/java/com/redslovesgames/tideborne/presentation/render/MutationTextureCache.java')
          text = cache.read_text(encoding='utf-8')
          old = 'Identifier location = Identifier.of("tide_traits", "dynamic/mutation/" + Long.toUnsignedString(NEXT_TEXTURE_ID.incrementAndGet(), 36));'
          new = 'Identifier location = Identifier.of("tideborne", "dynamic/mutation/" + Long.toUnsignedString(NEXT_TEXTURE_ID.incrementAndGet(), 36));'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one generated-texture allocation namespace, found {text.count(old)}')
          cache.write_text(text.replace(old, new), encoding='utf-8')
          PY
          mkdir -p src/test/java/com/redslovesgames/tideborne/presentation
          cat > src/test/java/com/redslovesgames/tideborne/presentation/DynamicTextureResourceOwnershipTest.java <<'JAVA'
          package com.redslovesgames.tideborne.presentation;

          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import org.junit.jupiter.api.Test;

          class DynamicTextureResourceOwnershipTest {
              private static final Path RENDERING = Path.of(
                      "src/main/java/com/redslovesgames/tideborne/presentation/render/MutationRendering.java");
              private static final Path CACHE = Path.of(
                      "src/main/java/com/redslovesgames/tideborne/presentation/render/MutationTextureCache.java");

              @Test
              void generatedMutationTexturesUseCurrentTideborneOwnership() throws IOException {
                  String rendering = Files.readString(RENDERING);
                  String cache = Files.readString(CACHE);

                  assertTrue(rendering.contains(
                          "return \"tideborne\".equals(texture.getNamespace()) && texture.getPath().startsWith(\"dynamic/mutation/\");"));
                  assertTrue(cache.contains(
                          "Identifier location = Identifier.of(\"tideborne\", \"dynamic/mutation/\""));
                  assertFalse(rendering.contains(
                          "\"tide_traits\".equals(texture.getNamespace()) && texture.getPath().startsWith(\"dynamic/mutation/\")"));
                  assertFalse(cache.contains(
                          "Identifier.of(\"tide_traits\", \"dynamic/mutation/\""));
              }

              @Test
              void externallyVisibleHistoricalReloadIdentityIsPreserved() throws IOException {
                  String rendering = Files.readString(RENDERING);
                  assertTrue(rendering.contains(
                          "private static final Identifier RELOAD_LISTENER_ID = Identifier.of(\"tide_traits\", \"mutation_textures\");"));
              }
          }
          JAVA
      - name: Validate P7.3 change boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed_java="$(git diff --name-only -- src/main/java | sort)"
          expected_java="$(printf '%s\n' \
            src/main/java/com/redslovesgames/tideborne/presentation/render/MutationRendering.java \
            src/main/java/com/redslovesgames/tideborne/presentation/render/MutationTextureCache.java | sort)"
          test "$changed_java" = "$expected_java"
          grep -F 'Identifier.of("tide_traits", "mutation_textures")' src/main/java/com/redslovesgames/tideborne/presentation/render/MutationRendering.java
          grep -F 'Identifier.of("tideborne", "dynamic/mutation/"' src/main/java/com/redslovesgames/tideborne/presentation/render/MutationTextureCache.java
          ! grep -RIn --include='*.java' -E 'tide_traits.*dynamic/mutation|dynamic/mutation.*tide_traits' src/main/java
          echo 'P7.3 Java resource change boundary passed'
      - name: Run focused Java 21 tests
        shell: bash
        run: |
          ./gradlew test \
            --tests com.redslovesgames.tideborne.presentation.DynamicTextureResourceOwnershipTest \
            --tests com.redslovesgames.tideborne.presentation.CanonicalSpecimenPresentationTest
      - name: Commit validated P7.3 product change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p7-temp-java-resource-audit.yml
          git config user.name "RedsLovesGames"
          git config user.email "75150137+RedsLovesGames@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "resources: canonicalize dynamic mutation texture IDs"
          git push origin HEAD:agent/p7-resources
