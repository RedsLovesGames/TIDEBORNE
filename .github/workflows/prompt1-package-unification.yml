name: Prompt 1 Astra Delta List

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-package-unification.yml'

permissions:
  contents: write

jobs:
  emit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Emit exact ordered delta file list
        shell: bash
        run: |
          set -euo pipefail
          cat .github/astra_normalized.part-* | base64 -d | xz -dc > /tmp/astra_normalized.tsv
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/astra_manifest.tsv
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          norm={}
          for line in Path('/tmp/astra_normalized.tsv').read_text().splitlines():
              p,h,style=line.split('\t'); norm[p]=(h,style)
          exact={}
          for line in Path('/tmp/astra_manifest.tsv').read_text().splitlines():
              p,h,t,size=line.split('\t'); exact[p]=(h,t=='1',int(size))
          temp_prefixes=('.github/astra_manifest.part-','.github/astra_normalized.part-','.github/astra_payload.part-','.github/astra_delta.part-')
          temp_exact={'.github/astra_text_payload.tar.xz','.github/package_unify.py.xz','.github/astra_newlines.json.xz.b64','.github/workflows/prompt1-package-unification.yml'}
          tracked=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          tracked={p for p in tracked if p not in temp_exact and not p.startswith(temp_prefixes)}
          substantive=[]
          for p in sorted(set(exact)&tracked):
              b=Path(p).read_bytes()
              if hashlib.sha256(b).hexdigest()==exact[p][0]: continue
              if exact[p][1]:
                  try: s=b.decode('utf-8')
                  except UnicodeDecodeError:
                      substantive.append(p); continue
                  n=s.replace('\r\n','\n').replace('\r','\n').encode()
                  if p not in norm or hashlib.sha256(n).hexdigest()!=norm[p][0]: substantive.append(p)
          missing=sorted(p for p in set(exact)-tracked if exact[p][1])
          ordered=substantive+missing
          assert len(substantive)==84, len(substantive)
          assert len(missing)==37, len(missing)
          assert len(ordered)==121, len(ordered)
          Path('.github/astra_delta_files.txt').write_text('\n'.join(ordered)+'\n')
          print('DELTA_FILES=121')
          print('FIRST='+ordered[0])
          print('LAST='+ordered[-1])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/astra_delta_files.txt
          git commit -m 'chore: stage ordered Astra delta file list'
          git push origin HEAD:dev
