name: Prompt 1 Astra Baseline Compare

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-package-unification.yml'

permissions:
  contents: write

jobs:
  compare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Verify complete Astra manifest and compare
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git branch --show-current)" = "dev"
          test -f .github/astra_manifest.part-00
          test -f .github/astra_manifest.part-01
          test -f .github/astra_manifest.part-02
          test "$(git hash-object .github/astra_manifest.part-00)" = "c0141f5f4407ed3fce1c0a634b605049b3b18c1d"
          test "$(git hash-object .github/astra_manifest.part-01)" = "f7878d29c326d0803aead05428ff9a3b835bf404"
          test "$(git hash-object .github/astra_manifest.part-02)" = "bcd3697546cd032db6b37205a92b956102236952"
          cat .github/astra_manifest.part-* | base64 -d > /tmp/astra_manifest.tsv.xz
          echo 'a258fe40afbb33dea64581d6a58cc0e7b67df526c5ecbda2785d588666ee284e  /tmp/astra_manifest.tsv.xz' | sha256sum -c -
          xz -dc /tmp/astra_manifest.tsv.xz > /tmp/astra_manifest.tsv
          echo '68dddda85828c8e931cfde8541f57c7f643e1b54650c97271d75d1b23b4f74f7  /tmp/astra_manifest.tsv' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          manifest = {}
          for line in Path('/tmp/astra_manifest.tsv').read_text().splitlines():
              rel, sha, text, size = line.split('\t')
              manifest[rel] = (sha, text == '1', int(size))
          temp_prefixes = (
              '.github/astra_manifest.part-',
              '.github/astra_payload.part-',
          )
          temp_exact = {
              '.github/astra_text_payload.tar.xz',
              '.github/package_unify.py.xz',
              '.github/workflows/prompt1-package-unification.yml',
          }
          tracked = set(subprocess.check_output(['git','ls-files'], text=True).splitlines())
          tracked = {p for p in tracked if p not in temp_exact and not p.startswith(temp_prefixes)}
          expected = set(manifest)
          missing = sorted(expected - tracked)
          extra = sorted(tracked - expected)
          changed=[]; same=[]
          for rel in sorted(expected & tracked):
              sha = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              (changed if sha != manifest[rel][0] else same).append(rel)
          print(f'ASTRA_MANIFEST_FILES={len(expected)}')
          print(f'CURRENT_NON_TEMP_TRACKED={len(tracked)}')
          print(f'SAME={len(same)}')
          print(f'CHANGED={len(changed)}')
          print(f'SNAPSHOT_ONLY={len(missing)}')
          print(f'CURRENT_ONLY={len(extra)}')
          print('=== CHANGED ===')
          for p in changed:
              print(f'M\t{manifest[p][1]}\t{manifest[p][2]}\t{p}')
          print('=== SNAPSHOT_ONLY ===')
          for p in missing:
              print(f'A\t{manifest[p][1]}\t{manifest[p][2]}\t{p}')
          print('=== CURRENT_ONLY ===')
          for p in extra:
              print(f'D\t{p}')
          PY
