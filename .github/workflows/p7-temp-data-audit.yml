name: P7 Temporary Data Audit

on:
  push:
    branches:
      - agent/p7-resources

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'chore: inspect Tide P7.2 data loading' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch exact Tide dependency
        shell: bash
        run: bash scripts/fetch_ci_dependencies.sh
      - name: Inspect Tide 2.1.1 datapack loading
        shell: bash
        run: |
          set -euo pipefail
          jar=dev/libs/tide-fabric-1.21.1-2.1.1.jar
          echo '=== Tide classes containing rod_accessories/bait literals ==='
          zipinfo -1 "$jar" '*.class' | while read -r cls; do
            hits="$(unzip -p "$jar" "$cls" | strings | grep -E 'rod_accessories|(^|/)bait($|/)|bait_items' || true)"
            if [ -n "$hits" ]; then
              echo "CLASS $cls"
              printf '%s\n' "$hits"
            fi
          done
          echo '=== Tide bundled rod-accessory/bait resources ==='
          zipinfo -1 "$jar" | grep -E '(^|/)rod_accessories/|(^|/)bait/' || true
          echo '=== Candidate reload/data classes ==='
          zipinfo -1 "$jar" '*.class' | grep -Ei 'resource|reload|accessor|accessor|bait|rod' | head -n 200 || true
