name: Prompt 1 Verified Mixin Recovery

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Restore only exact validator-reported mixins
        shell: bash
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          git fetch --all --tags --prune
          verified=a4c7d01a2c761a9a52e6bcbe8ef361b2d46b33ce
          sed -i 's/\r$//' scripts/validate_repository.sh 2>/dev/null || true
          chmod +x scripts/validate_repository.sh
          report=.github/prompt1_verified_mixin_recovery.txt
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          for attempt in $(seq 1 20); do
            set +e
            bash scripts/validate_repository.sh > /tmp/validator.log 2>&1
            rc=$?
            set -e
            if [ "$rc" = 0 ]; then
              echo 'VALIDATOR_RC=0' >> "$report"
              cat /tmp/validator.log >> "$report"
              break
            fi
            line="$(grep -m1 '^Missing mixin source from ' /tmp/validator.log || true)"
            if [ -z "$line" ]; then
              echo "VALIDATOR_RC=$rc" >> "$report"
              cat /tmp/validator.log >> "$report"
              break
            fi
            fqcn="${line##*: }"
            path="src/main/java/${fqcn//./\/}.java"
            echo "REPORTED=$path" >> "$report"
            if git cat-file -e "$verified:$path" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "$verified:$path" > "$path"
              echo "RESTORED_EXACT=$path FROM=$verified" >> "$report"
            else
              echo "UNAVAILABLE=$path" >> "$report"
              echo "VALIDATOR_RC=$rc" >> "$report"
              cat /tmp/validator.log >> "$report"
              break
            fi
          done
          echo "FORBIDDEN_PATHS=$(find src/main/java -type f -name '*.java' | grep -Ec '/(tidetraits|tideteamjournal|tideboundcompatibility)/|/fishing/v2/' || true)" >> "$report"
          echo "FORBIDDEN_DECLS=$(grep -RIE '^package com\.redslovesgames\.(tidetraits|tideteamjournal|tideboundcompatibility)(\.|;)|^package com\.redslovesgames\.tideborne\.fishing\.v2(\.|;)' src/main/java --include='*.java' | wc -l)" >> "$report"
          echo "OUTSIDE_ROOT=$(grep -RIE '^package ' src/main/java --include='*.java' | grep -v 'package com.redslovesgames.tideborne' | wc -l)" >> "$report"
          git checkout -- scripts/validate_repository.sh 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java "$report"
          git commit -m 'fix: restore validator-proven migrated mixin sources' || true
          git push origin HEAD:dev
