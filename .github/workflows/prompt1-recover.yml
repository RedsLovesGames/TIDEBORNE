name: Prompt 1 Transport Cleanup

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Validate ownership and remove obsolete Prompt 1 transport machinery
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          sed -i 's/\r$//' scripts/validate_repository.sh 2>/dev/null || true
          chmod +x scripts/validate_repository.sh
          bash scripts/validate_repository.sh
          git checkout -- scripts/validate_repository.sh 2>/dev/null || true

          forbidden_paths="$(find src/main/java -type f -name '*.java' | grep -Ec '/(tidetraits|tideteamjournal|tideboundcompatibility)/|/fishing/v2/' || true)"
          forbidden_decls="$(grep -RIE '^package com\.redslovesgames\.(tidetraits|tideteamjournal|tideboundcompatibility)(\.|;)|^package com\.redslovesgames\.tideborne\.fishing\.v2(\.|;)' src/main/java --include='*.java' | wc -l)"
          outside_root="$(grep -RIE '^package ' src/main/java --include='*.java' | grep -v 'package com.redslovesgames.tideborne' | wc -l)"
          test "$forbidden_paths" = 0
          test "$forbidden_decls" = 0
          test "$outside_root" = 0

          rm -f .github/astra_delta.part-* \
                .github/astra_delta.tail-* \
                .github/astra_delta.tailb-* \
                .github/astra_delta_files.txt \
                .github/astra_manifest.part-* \
                .github/astra_newlines.json.xz.b64 \
                .github/astra_normalized.part-* \
                .github/astra_text_payload.tar.xz \
                .github/package_unify.py.xz \
                .github/prompt1_satchel_patch.py
          rm -f .github/workflows/prompt1-repair.yml
          rm -f .github/workflows/prompt1-recover.yml

          if find .github -maxdepth 1 -type f \( -name 'astra_delta*' -o -name 'astra_manifest*' -o -name 'astra_newlines*' -o -name 'astra_normalized*' -o -name 'astra_text_payload*' -o -name 'package_unify.py.xz' \) | grep -q .; then
            echo 'Prompt 1 Astra transport machinery remains after cleanup' >&2
            exit 1
          fi
          test ! -e .github/prompt1_satchel_patch.py
          test ! -e .github/workflows/prompt1-repair.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove Prompt 1 transport machinery'
          git push origin HEAD:dev
