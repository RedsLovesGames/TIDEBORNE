name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Inspect compiled recovery sources
        shell: bash
        run: |
          set -euo pipefail
          report=.github/prompt1_bytecode_probe.txt
          classes='GearArchetypeCases SatchelTackleScreen SatchelGearSummary SatchelLoadouts SatchelPreset SatchelTackleExchange SatchelTackleHandler TackleRenamePayload TackleViewPayload'
          {
            echo '== reference jar matches =='
            for c in $classes; do
              echo "-- $c --"
              jar tf Tideborne-1.3.57-perfect-catch-trait-luck.jar | grep -F "$c" || true
            done
            echo '== all satchel/tackle classes in reference =='
            jar tf Tideborne-1.3.57-perfect-catch-trait-luck.jar | grep -Ei 'satchel|tackle|archetype' | sort || true
          } > "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore: probe compiled Astra gap sources'
          git push origin HEAD:dev
