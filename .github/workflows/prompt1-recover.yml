name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Inspect Astra newline reconstruction map
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/astra_newlines.json.xz.b64 | xz -dc > /tmp/newlines.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/newlines.json').read_text())
          out=[f'TYPE={type(d).__name__}',f'COUNT={len(d)}']
          for i,(k,v) in enumerate(d.items()):
              if i>=20: break
              out.append(f'{k}\t{type(v).__name__}\t{repr(v)[:1000]}')
          Path('.github/prompt1_newline_probe.txt').write_text('\n'.join(out)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/prompt1_newline_probe.txt
          git commit -m 'chore: inspect Astra newline map'
          git push origin HEAD:dev
