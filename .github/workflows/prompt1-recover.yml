name: Prompt 1 Compile Recheck

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile and validate
        shell: bash
        run: |
          set -u
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          report=.github/prompt1_compile_recheck.txt
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          sed -i 's/\r$//' scripts/fetch_ci_dependencies.sh scripts/validate_repository.sh 2>/dev/null || true
          chmod +x gradlew scripts/*.sh 2>/dev/null || true
          set +e
          bash scripts/fetch_ci_dependencies.sh >/tmp/deps.log 2>&1; deps=$?
          ./gradlew compileJava --no-daemon --console=plain >/tmp/compile.log 2>&1; compile=$?
          bash scripts/validate_repository.sh >/tmp/validator.log 2>&1; validator=$?
          set -e
          echo "DEPS_RC=$deps" >> "$report"
          echo "COMPILE_RC=$compile" >> "$report"
          echo "VALIDATOR_RC=$validator" >> "$report"
          echo "=== COMPILE ===" >> "$report"; tail -180 /tmp/compile.log >> "$report"
          echo "=== VALIDATOR ===" >> "$report"; cat /tmp/validator.log >> "$report"
          git checkout -- scripts/fetch_ci_dependencies.sh scripts/validate_repository.sh 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'test: record Prompt 1 compile recheck' || true
          git push origin HEAD:dev
          [ "$deps" = 0 ] && [ "$compile" = 0 ] && [ "$validator" = 0 ]
