name: Prompt 1 Contract History Search

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Search exact reachable contracts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          report=.github/prompt1_contract_history.txt
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          for term in 'tackle()' 'archetypes(' 'BobberBonuses.get('; do
            echo "=== TERM: $term ===" >> "$report"
            count=0
            while read -r commit; do
              matches="$(git grep -n -F "$term" "$commit" -- 'src/main/java/**/*.java' 2>/dev/null || true)"
              if [ -n "$matches" ]; then
                echo "COMMIT $commit" >> "$report"
                printf '%s\n' "$matches" >> "$report"
                count=$((count+1))
                [ "$count" -ge 8 ] && break
              fi
            done < <(git rev-list --all)
            echo "MATCH_COMMITS=$count" >> "$report"
          done
          echo "=== PATH HISTORY SatchelGearSummary ===" >> "$report"
          git log --all --name-only --pretty='COMMIT %H' -- '*SatchelGearSummary.java' >> "$report" || true
          echo "=== PATH HISTORY BobberBonuses ===" >> "$report"
          git log --all --name-only --pretty='COMMIT %H' -- '*BobberBonuses.java' >> "$report" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'test: record exact contract history search' || true
          git push origin HEAD:dev
