name: Prompt 1 Exact Archive Recovery

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Scan reachable archive members for authoritative hashes
        shell: bash
        run: |
          set -euo pipefail
          report=.github/prompt1_archive_hash_recovery.txt
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/manifest.tsv
          git fetch origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true
          git rev-list --objects --all > /tmp/objects_with_paths.txt
          python3 - <<'PY' > "$report"
          from pathlib import Path
          import subprocess, hashlib, io, zipfile
          manifest=[]
          for line in Path('/tmp/manifest.tsv').read_text().splitlines():
              p,h,t,s=line.split('\t'); manifest.append((p,h,int(s)))
          wanted={h:(p,s) for p,h,s in manifest if not Path(p).is_file() or hashlib.sha256(Path(p).read_bytes()).hexdigest()!=h}
          print('UNRESOLVED_START='+str(len(wanted)))
          objects=[]
          for line in Path('/tmp/objects_with_paths.txt').read_text(errors='replace').splitlines():
              parts=line.split(' ',1); oid=parts[0]; path=parts[1] if len(parts)>1 else ''
              if path.lower().endswith(('.jar','.zip')): objects.append((oid,path))
          # Deduplicate object ids while preserving a representative historical path.
          seen=set(); archives=[]
          for oid,path in objects:
              if oid not in seen: seen.add(oid); archives.append((oid,path))
          print('ARCHIVE_BLOBS='+str(len(archives)))
          hits={}
          for oid,path in archives:
              try: data=subprocess.check_output(['git','cat-file','blob',oid],stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError: continue
              try: z=zipfile.ZipFile(io.BytesIO(data))
              except Exception: continue
              for info in z.infolist():
                  if info.is_dir(): continue
                  try: b=z.read(info)
                  except Exception: continue
                  h=hashlib.sha256(b).hexdigest()
                  if h in wanted and h not in hits:
                      target,size=wanted[h]
                      if len(b)==size: hits[h]=(target,oid,path,info.filename,len(b))
          print('EXACT_ARCHIVE_HITS='+str(len(hits)))
          for h,(target,oid,path,member,size) in sorted(hits.items(),key=lambda x:x[1][0]):
              print(f'HIT\t{target}\t{h}\t{oid}\t{path}\t{member}\t{size}')
          for h,(target,size) in sorted(wanted.items(),key=lambda x:x[1][0]):
              if h not in hits: print(f'MISS\t{target}\t{h}\t{size}')
          PY
          cat "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore: scan archives for exact Astra files'
          git push origin HEAD:dev
