name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Audit exact Astra baseline coverage
        shell: bash
        run: |
          set -euo pipefail
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/manifest.tsv
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          entries=[]
          for line in Path('/tmp/manifest.tsv').read_text().splitlines():
              p,h,t,s=line.split('\t'); entries.append((p,h,t=='1',int(s)))
          exact=[]; missing=[]; mismatch=[]
          for p,h,istext,size in entries:
              q=Path(p)
              if not q.is_file(): missing.append((p,h,size)); continue
              b=q.read_bytes()
              if len(b)==size and hashlib.sha256(b).hexdigest()==h: exact.append(p)
              else: mismatch.append((p,h,size,hashlib.sha256(b).hexdigest(),len(b)))
          out=[f'MANIFEST_FILES={len(entries)}',f'EXACT_FILES={len(exact)}',f'MISSING_FILES={len(missing)}',f'MISMATCH_FILES={len(mismatch)}']
          out.append('MISSING:')
          out += ['\t'.join(map(str,x)) for x in missing]
          out.append('MISMATCH:')
          out += ['\t'.join(map(str,x)) for x in mismatch]
          Path('.github/prompt1_residual_gap.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out[:4]))
          assert len(exact)+len(missing)+len(mismatch)==564
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/prompt1_residual_gap.txt
          git commit -m 'chore: audit residual Astra baseline gap'
          git push origin HEAD:dev
