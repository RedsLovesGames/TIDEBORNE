name: Prompt 1 Package Unification

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply established package migration
        shell: bash
        run: |
          set -euo pipefail
          xz -dc .github/package_unify.py.xz > /tmp/package_unify.py
          python3 /tmp/package_unify.py
          report=.github/prompt1_migration_report.txt
          : > "$report"
          echo "MIGRATION_HEAD=$(git rev-parse HEAD)" >> "$report"
          echo "MAIN_JAVA=$(find src/main/java -type f -name '*.java' | wc -l)" >> "$report"
          echo "TEST_JAVA=$(find src/test/java -type f -name '*.java' | wc -l)" >> "$report"
          echo "FORBIDDEN_PATHS=$(find src/main/java -type f -name '*.java' | grep -Ec '/(tidetraits|tideteamjournal|tideboundcompatibility)/|/fishing/v2/' || true)" >> "$report"
          echo "FORBIDDEN_DECLS=$(grep -RIE '^package com\.redslovesgames\.(tidetraits|tideteamjournal|tideboundcompatibility)(\.|;)|^package com\.redslovesgames\.tideborne\.fishing\.v2(\.|;)' src/main/java --include='*.java' | wc -l)" >> "$report"
          echo "OUTSIDE_ROOT=$(grep -RIE '^package ' src/main/java --include='*.java' | grep -v 'package com.redslovesgames.tideborne' | wc -l)" >> "$report"
          echo '== package script tail ==' >> "$report"
          tail -120 /tmp/package_unify.py >> "$report"
          echo '== changed paths summary ==' >> "$report"
          git status --short >> "$report"
          test "$(grep '^FORBIDDEN_PATHS=' "$report" | cut -d= -f2)" = 0
          test "$(grep '^FORBIDDEN_DECLS=' "$report" | cut -d= -f2)" = 0
          test "$(grep '^OUTSIDE_ROOT=' "$report" | cut -d= -f2)" = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: unify active Java under Tideborne packages'
          git push origin HEAD:dev
