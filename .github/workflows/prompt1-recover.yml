name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Remove Java paths absent from Astra manifest
        shell: bash
        run: |
          set -euo pipefail
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/manifest.tsv
          python3 - <<'PY'
          from pathlib import Path
          manifest=set()
          for line in Path('/tmp/manifest.tsv').read_text().splitlines():
              p=line.split('\t',1)[0]; manifest.add(p)
          prod=sorted(p.as_posix() for p in Path('src/main/java').rglob('*.java') if p.as_posix() not in manifest)
          tests=sorted(p.as_posix() for p in Path('src/test/java').rglob('*.java') if p.as_posix() not in manifest)
          assert len(prod)==16,(len(prod),prod)
          assert len(tests)==2,(len(tests),tests)
          for p in prod+tests: Path(p).unlink()
          out=[f'REMOVED_PRODUCTION_JAVA={len(prod)}',f'REMOVED_TEST_JAVA={len(tests)}','PRODUCTION:']+prod+['TESTS:']+tests
          Path('.github/prompt1_manifest_extras_removed.txt').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          assert sum(1 for _ in Path('src/main/java').rglob('*.java'))==265
          assert sum(1 for _ in Path('src/test/java').rglob('*.java'))==61
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove Java files absent from Astra baseline'
          git push origin HEAD:dev
