name: Prompt 1 Reachable Source Search

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Search all reachable repository history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          report=.github/prompt1_reachable_source_search.txt
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          echo "=== PATH HISTORY: SatchelSpecimenDisplay ===" >> "$report"
          git log --all --name-only --pretty='COMMIT %H' -- '*SatchelSpecimenDisplay*' >> "$report" || true
          echo "=== PATH HISTORY: TideTeamJournalServiceMixin ===" >> "$report"
          git log --all --name-only --pretty='COMMIT %H' -- '*TideTeamJournalServiceMixin*' >> "$report" || true
          echo "=== CONTENT HISTORY: SatchelSpecimenDisplay ===" >> "$report"
          found=0
          while read -r commit; do
            matches="$(git grep -l 'SatchelSpecimenDisplay' "$commit" -- '*.java' 2>/dev/null || true)"
            if [ -n "$matches" ]; then
              echo "COMMIT $commit" >> "$report"
              printf '%s\n' "$matches" >> "$report"
              found=1
            fi
          done < <(git rev-list --all)
          echo "SATCHEL_CONTENT_FOUND=$found" >> "$report"
          echo "=== CURRENT TeamJournalService references ===" >> "$report"
          git grep -n 'TeamJournalService' HEAD -- 'src/**/*.java' 'src/**/*.json' >> "$report" || true
          echo "=== ALL OBJECT PATHS matching names ===" >> "$report"
          git rev-list --objects --all | grep -E 'SatchelSpecimenDisplay|TideTeamJournalServiceMixin|TeamJournalService\.java' >> "$report" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'test: record reachable missing-source search' || true
          git push origin HEAD:dev
