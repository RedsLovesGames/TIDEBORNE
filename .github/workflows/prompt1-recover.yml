name: Prompt 1 Exact Contract Search

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/prompt1-recover.yml']

permissions:
  contents: write

jobs:
  search:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Find source definitions only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          report=.github/prompt1_exact_contract_search.txt
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          for commit in $(git rev-list --all); do
            for path in \
              src/main/java/com/redslovesgames/tideborne/satchel/network/SatchelView.java \
              src/main/java/com/redslovesgames/tidetraits/satchel/network/SatchelView.java \
              src/main/java/com/redslovesgames/tidetraits/client/gui/satchel/network/SatchelView.java; do
              body="$(git show "$commit:$path" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | grep -q 'tackle'; then
                echo "SATCHEL_VIEW_COMMIT=$commit PATH=$path" >> "$report"
                printf '%s\n' "$body" | grep -n -C 4 'tackle' >> "$report"
                break 2
              fi
            done
          done
          for commit in $(git rev-list --all); do
            for path in \
              src/main/java/com/redslovesgames/tideborne/satchel/SatchelGearSummary.java \
              src/main/java/com/redslovesgames/tidetraits/satchel/SatchelGearSummary.java \
              src/main/java/com/redslovesgames/tidetraits/client/gui/satchel/SatchelGearSummary.java; do
              body="$(git show "$commit:$path" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | grep -q 'archetypes'; then
                echo "GEAR_SUMMARY_COMMIT=$commit PATH=$path" >> "$report"
                printf '%s\n' "$body" | grep -n -C 8 'archetypes' >> "$report"
                break 2
              fi
            done
          done
          for commit in $(git rev-list --all); do
            for path in \
              src/main/java/com/redslovesgames/tideborne/journal/BobberBonuses.java \
              src/main/java/com/redslovesgames/tideteamjournal/BobberBonuses.java; do
              body="$(git show "$commit:$path" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | grep -Eq 'static .* get\('; then
                echo "BOBBER_BONUSES_COMMIT=$commit PATH=$path" >> "$report"
                printf '%s\n' "$body" | grep -n -C 8 -E 'static .* get\(' >> "$report"
                break 2
              fi
            done
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$report"
          git commit -m 'test: record exact contract implementation search' || true
          git push origin HEAD:dev
