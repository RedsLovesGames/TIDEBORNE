name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Forensic recover Astra suffix chunks
        shell: bash
        run: |
          set -euo pipefail
          report=.github/prompt1_suffix_recovery.txt
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/manifest.tsv
          cat .github/astra_delta.tailb-03 .github/astra_delta.tailb-04 .github/astra_delta.tailb-05 .github/astra_delta.tailb-06 .github/astra_delta.tailb-07 > /tmp/suffix.b64
          base64 -d /tmp/suffix.b64 > /tmp/suffix.bin
          python3 - <<'PY'
          from pathlib import Path
          import lzma, hashlib, re
          raw=Path('/tmp/suffix.bin').read_bytes()
          results=[]
          # LZMA2 dictionary reset/control bytes are >= 0xE0. Try likely reset points and common dict sizes.
          dicts=[1<<20,2<<20,4<<20,8<<20,16<<20,32<<20,64<<20]
          for off,b in enumerate(raw):
              if b < 0xE0: continue
              for ds in dicts:
                  try:
                      dec=lzma.LZMADecompressor(format=lzma.FORMAT_RAW,filters=[{'id':lzma.FILTER_LZMA2,'dict_size':ds}])
                      out=dec.decompress(raw[off:])
                  except lzma.LZMAError:
                      continue
                  if len(out) < 512: continue
                  score=0
                  if b'ustar' in out: score += 100
                  score += out.count(b'src/')*10 + out.count(b'.java')*5 + out.count(b'package com.redslovesgames')*20
                  printable=sum((c in b'\n\r\t' or 32 <= c < 127) for c in out[:min(len(out),20000)]) / min(len(out),20000)
                  if score or printable > .85:
                      results.append((score,len(out),printable,off,ds,out))
          results.sort(key=lambda x:(x[0],x[1],x[2]),reverse=True)
          lines=[f'SUFFIX_BYTES={len(raw)}',f'CANDIDATES={len(results)}']
          for rank,(score,n,p,off,ds,out) in enumerate(results[:20],1):
              op=Path(f'/tmp/suffix_candidate_{rank}.bin'); op.write_bytes(out)
              lines.append(f'#{rank} score={score} bytes={n} printable={p:.3f} offset={off} dict={ds} sha256={hashlib.sha256(out).hexdigest()}')
              sample=re.sub(rb'[^\x09\x0a\x0d\x20-\x7e]',b'.',out[:1200]).decode('ascii','replace')
              lines.append(sample)
          Path('.github/prompt1_suffix_recovery.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines[:25]))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore: probe Astra suffix recovery'
          git push origin HEAD:dev
