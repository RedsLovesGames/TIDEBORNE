name: Prompt 1 Blocker Inventory

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/prompt1-recover.yml']

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Record compiler and ownership blocker inventory
        shell: bash
        run: |
          set -u
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          report=.github/prompt1_blocker_inventory.txt
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          sed -i 's/\r$//' scripts/fetch_ci_dependencies.sh scripts/validate_repository.sh 2>/dev/null || true
          chmod +x gradlew scripts/*.sh 2>/dev/null || true
          bash scripts/fetch_ci_dependencies.sh >/tmp/deps.log 2>&1 || true
          set +e
          ./gradlew compileJava --no-daemon --console=plain >/tmp/compile.log 2>&1
          compile=$?
          bash scripts/validate_repository.sh >/tmp/validator.log 2>&1
          validator=$?
          set -e
          echo "COMPILE_RC=$compile" >> "$report"
          echo "VALIDATOR_RC=$validator" >> "$report"
          echo "=== COMPILER ERRORS ===" >> "$report"
          grep -E '(^|: )error:|cannot find symbol|constructor .* cannot be applied|symbol:|location:' /tmp/compile.log >> "$report" || true
          echo "=== VALIDATOR ===" >> "$report"
          cat /tmp/validator.log >> "$report"
          echo "=== STRUCTURAL OWNERSHIP ===" >> "$report"
          echo "FORBIDDEN_PATHS=$(find src/main/java -type f -name '*.java' | grep -Ec '/(tidetraits|tideteamjournal|tideboundcompatibility)/|/fishing/v2/' || true)" >> "$report"
          echo "FORBIDDEN_DECLS=$(grep -RIE '^package com\.redslovesgames\.(tidetraits|tideteamjournal|tideboundcompatibility)(\.|;)|^package com\.redslovesgames\.tideborne\.fishing\.v2(\.|;)' src/main/java --include='*.java' | wc -l)" >> "$report"
          echo "OUTSIDE_ROOT=$(grep -RIE '^package ' src/main/java --include='*.java' | grep -v 'package com.redslovesgames.tideborne' | wc -l)" >> "$report"
          echo "GEAR_ARCHETYPE_PLACEHOLDER_LINES=$(wc -l < src/main/java/com/redslovesgames/tideborne/fishing/gametest/GearArchetypeCases.java)" >> "$report"
          git checkout -- scripts/fetch_ci_dependencies.sh scripts/validate_repository.sh 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$report"
          git commit -m 'test: record Prompt 1 blocker inventory' || true
          git push origin HEAD:dev
