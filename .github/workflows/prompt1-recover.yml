name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Inspect staged Astra transport
        shell: bash
        run: |
          set -euo pipefail
          report=.github/prompt1_recovery_report.txt
          : > "$report"
          echo "HEAD=$(git rev-parse HEAD)" >> "$report"
          echo "== transport files ==" >> "$report"
          find .github -maxdepth 1 -type f -name 'astra_*' -printf '%f %s\n' | sort >> "$report"
          echo "== package script ==" >> "$report"
          xz -dc .github/package_unify.py.xz > /tmp/package_unify.py
          sed -n '1,260p' /tmp/package_unify.py >> "$report"
          echo "== text payload ==" >> "$report"
          sha256sum .github/astra_text_payload.tar.xz >> "$report"
          xz -dc .github/astra_text_payload.tar.xz | tar -tvf - >> "$report" || true
          echo "== candidate assembled streams ==" >> "$report"
          for pattern in 'astra_delta.part-*' 'astra_delta.part-* astra_delta.tail-*' 'astra_delta.part-* astra_delta.tail-* astra_delta.tailb-*'; do
            rm -f /tmp/candidate.b64 /tmp/candidate.bin
            for p in $pattern; do
              for f in .github/$p; do
                [ -f "$f" ] && cat "$f" >> /tmp/candidate.b64
              done
            done
            echo "PATTERN=$pattern" >> "$report"
            wc -c /tmp/candidate.b64 >> "$report"
            if base64 -d /tmp/candidate.b64 > /tmp/candidate.bin 2>/tmp/b64err; then
              sha256sum /tmp/candidate.bin >> "$report"
              file /tmp/candidate.bin >> "$report"
              xz -t /tmp/candidate.bin >> "$report" 2>&1 || true
              xz -dc /tmp/candidate.bin 2>/dev/null | tar -tvf - >> "$report" 2>&1 || true
            else
              echo "base64 decode failed" >> "$report"
              cat /tmp/b64err >> "$report"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore: inspect Astra recovery state'
          git push origin HEAD:dev
