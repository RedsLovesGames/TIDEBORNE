name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Tolerant recovery
        shell: bash
        run: |
          set -u
          report=.github/prompt1_recovery_report2.txt
          : > "$report"; mkdir -p /tmp/textpayload /tmp/partial
          echo '== text payload salvage ==' >> "$report"
          xz -dc .github/astra_text_payload.tar.xz > /tmp/textpayload.tar 2>/tmp/txzerr; echo "xz_rc=$? bytes=$(wc -c < /tmp/textpayload.tar)" >> "$report"; cat /tmp/txzerr >> "$report"
          tar -tvf /tmp/textpayload.tar >> "$report" 2>&1
          tar -xf /tmp/textpayload.tar -C /tmp/textpayload 2>/tmp/ttarerr; echo "tar_rc=$?" >> "$report"; cat /tmp/ttarerr >> "$report"
          if [ -f /tmp/textpayload/manifest.json ]; then
            python3 - <<'PY' >> "$report"
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/textpayload/manifest.json').read_text())
          print('manifest_type',type(d).__name__)
          if isinstance(d,dict):
              print('keys',sorted(d.keys()))
              for k,v in d.items(): print('FIELD',k,type(v).__name__,len(v) if isinstance(v,(list,dict)) else repr(v)[:300])
              print('sample',repr(d)[:12000])
          else:
              print('len',len(d)); print('sample',repr(d[:5])[:12000])
          PY
          fi
          echo '== partial delta salvage ==' >> "$report"
          cat .github/astra_delta.part-* .github/astra_delta.tail-* .github/astra_delta.tailb-00 .github/astra_delta.tailb-01 > /tmp/prefix.b64
          python3 - <<'PY' >> "$report"
          from pathlib import Path
          import base64,hashlib
          b=Path('/tmp/prefix.b64').read_bytes(); u=len(b)-len(b)%4
          raw=base64.b64decode(b[:u],validate=False); Path('/tmp/prefix.xz').write_bytes(raw)
          print('b64',len(b),'usable',u,'raw',len(raw),'sha256',hashlib.sha256(raw).hexdigest())
          PY
          xz -dc /tmp/prefix.xz > /tmp/prefix.tar 2>/tmp/pxzerr; echo "xz_rc=$? tar_bytes=$(wc -c < /tmp/prefix.tar)" >> "$report"; cat /tmp/pxzerr >> "$report"
          tar -tvf /tmp/prefix.tar >> "$report" 2>&1
          tar -xf /tmp/prefix.tar -C /tmp/partial 2>/tmp/ptarerr; echo "tar_rc=$?" >> "$report"; cat /tmp/ptarerr >> "$report"
          echo '== recovered hashes ==' >> "$report"
          find /tmp/partial -type f -print0 | sort -z | while IFS= read -r -d '' f; do rel=${f#/tmp/partial/}; printf '%s\t' "$rel" >> "$report"; sha256sum "$f"|awk '{print $1}' >> "$report"; done
          echo '== history matches ==' >> "$report"
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/manifest.tsv 2>/tmp/merr; echo "manifest_rc=$? lines=$(wc -l < /tmp/manifest.tsv)" >> "$report"; cat /tmp/merr >> "$report"
          python3 - <<'PY' >> "$report"
          from pathlib import Path
          import subprocess,hashlib
          delta=set(Path('.github/astra_delta_files.txt').read_text().splitlines()); E=[]
          for line in Path('/tmp/manifest.tsv').read_text().splitlines():
              z=line.split('\t')
              if len(z)!=4: continue
              p,h,t,s=z
              if p in delta:E.append((p,h,int(s)))
          found=[];missing=[]
          for i,(p,h,s) in enumerate(E,1):
              try: revs=subprocess.check_output(['git','rev-list','--all','--',p],text=True).splitlines()
              except: revs=[]
              hit=''
              for r in revs:
                  try:data=subprocess.check_output(['git','show',f'{r}:{p}'],stderr=subprocess.DEVNULL)
                  except:continue
                  if hashlib.sha256(data).hexdigest()==h: hit=r; break
              (found if hit else missing).append((p,h,s,hit))
          print('delta',len(E),'found',len(found),'missing',len(missing))
          for x in found: print('FOUND\t'+'\t'.join(map(str,x)))
          for x in missing: print('MISSING\t'+'\t'.join(map(str,x)))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"; git commit -m 'chore: salvage Astra transport'; git push origin HEAD:dev
