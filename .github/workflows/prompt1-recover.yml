name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Dry-run established migration against pruned Astra shape
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/probe && mkdir /tmp/probe
          git archive HEAD | tar -x -C /tmp/probe
          xz -dc .github/package_unify.py.xz > /tmp/package_unify.py
          report=.github/prompt1_pruned_migration_probe.txt
          {
            echo "SOURCE_PRODUCTION=$(find /tmp/probe/src/main/java -type f -name '*.java' | wc -l)"
            echo "SOURCE_TESTS=$(find /tmp/probe/src/test/java -type f -name '*.java' | wc -l)"
            echo '== migration output =='
          } > "$report"
          (cd /tmp/probe && python3 /tmp/package_unify.py) >> "$report" 2>&1
          echo "AFTER_PRODUCTION=$(find /tmp/probe/src/main/java -type f -name '*.java' | wc -l)" >> "$report"
          echo "AFTER_TESTS=$(find /tmp/probe/src/test/java -type f -name '*.java' | wc -l)" >> "$report"
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/manifest.tsv
          python3 - <<'PY' >> "$report"
          from pathlib import Path
          manifest={line.split('\t',1)[0] for line in Path('/tmp/manifest.tsv').read_text().splitlines()}
          prod=[p for p in manifest if p.startswith('src/main/java/') and p.endswith('.java')]
          tests=[p for p in manifest if p.startswith('src/test/java/') and p.endswith('.java')]
          missing_prod=sorted(p for p in prod if not Path(p).is_file())
          missing_test=sorted(p for p in tests if not Path(p).is_file())
          print('AUTHORITATIVE_PRODUCTION=',len(prod),sep='')
          print('AUTHORITATIVE_TESTS=',len(tests),sep='')
          print('MISSING_PRODUCTION=',len(missing_prod),sep='')
          print('MISSING_TESTS=',len(missing_test),sep='')
          print('EXPECTED_FINAL_MOVE_COUNTS=251/67')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore: probe pruned Prompt 1 migration counts'
          git push origin HEAD:dev
