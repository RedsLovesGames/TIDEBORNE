name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Probe established package migration
        shell: bash
        run: |
          set +e
          xz -dc .github/package_unify.py.xz > /tmp/package_unify.py
          report=.github/prompt1_migration_probe.txt
          : > "$report"
          echo '== script tail ==' >> "$report"
          tail -n 180 /tmp/package_unify.py >> "$report"
          echo '== source counts before ==' >> "$report"
          printf 'prod_java=' >> "$report"; find src/main/java -type f -name '*.java' | wc -l >> "$report"
          printf 'test_java=' >> "$report"; find src/test/java -type f -name '*.java' | wc -l >> "$report"
          echo '== run ==' >> "$report"
          python3 /tmp/package_unify.py >> "$report" 2>&1
          rc=$?
          echo "rc=$rc" >> "$report"
          echo '== source counts after working tree ==' >> "$report"
          printf 'prod_java=' >> "$report"; find src/main/java -type f -name '*.java' | wc -l >> "$report"
          printf 'test_java=' >> "$report"; find src/test/java -type f -name '*.java' | wc -l >> "$report"
          echo '== status summary ==' >> "$report"
          git status --short >> "$report"
          git reset --hard HEAD >/dev/null
          git clean -fd >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # restore report after reset
          echo "$rc" >/tmp/probe_rc
          # rerun only report generation in an isolated worktree was lost by reset, so copy from temp is needed
        
      - name: Probe safely with worktree copy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/probe && mkdir /tmp/probe
          git archive HEAD | tar -x -C /tmp/probe
          xz -dc .github/package_unify.py.xz >/tmp/package_unify.py
          report=.github/prompt1_migration_probe.txt
          {
            echo '== source counts before =='
            printf 'prod_java='; find /tmp/probe/src/main/java -type f -name '*.java' | wc -l
            printf 'test_java='; find /tmp/probe/src/test/java -type f -name '*.java' | wc -l
            echo '== run =='
          } > "$report"
          (cd /tmp/probe && python3 /tmp/package_unify.py) >> "$report" 2>&1 || rc=$?
          echo "rc=${rc:-0}" >> "$report"
          echo '== source counts after ==' >> "$report"
          printf 'prod_java=' >> "$report"; find /tmp/probe/src/main/java -type f -name '*.java' | wc -l >> "$report"
          printf 'test_java=' >> "$report"; find /tmp/probe/src/test/java -type f -name '*.java' | wc -l >> "$report"
          echo '== changed count ==' >> "$report"
          diff -qr --exclude='.github' . /tmp/probe | wc -l >> "$report" || true
          echo '== missing Astra Java paths ==' >> "$report"
          awk -F '\t' '$1=="MISSING_PATH" && $2 ~ /src\/(main|test)\/java\/.*\.java$/ {print $2}' .github/prompt1_gap_detail.txt >> "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore: probe package migration gap'
          git push origin HEAD:dev
