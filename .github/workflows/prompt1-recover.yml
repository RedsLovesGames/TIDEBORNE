name: Prompt 1 Recover Astra Transport

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Search exact content duplicates
        shell: bash
        run: |
          set -euo pipefail
          cat .github/astra_manifest.part-* | base64 -d | xz -dc > /tmp/manifest.tsv
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          exact={}
          for line in Path('/tmp/manifest.tsv').read_text().splitlines():
              p,h,t,s=line.split('\t'); exact[p]=(h,t=='1',int(s))
          # Use previously computed unresolved list.
          lines=Path('.github/prompt1_gap.txt').read_text().splitlines()
          i=lines.index('UNRESOLVED_FILES:')+1
          unresolved=lines[i:]
          by_hash={}
          for root,dirs,files in os.walk('.'):
              if root.startswith('./.git'): continue
              for fn in files:
                  q=Path(root)/fn
                  try:b=q.read_bytes()
                  except:continue
                  by_hash.setdefault(hashlib.sha256(b).hexdigest(),[]).append(q.as_posix().removeprefix('./'))
          out=[]
          exists=0; missing=0; dup=0
          for p in unresolved:
              h,istext,size=exact[p]
              cur=Path(p)
              status='EXISTS' if cur.is_file() else 'MISSING_PATH'
              exists += cur.is_file(); missing += not cur.is_file()
              matches=[q for q in by_hash.get(h,[]) if q!=p]
              if matches: dup+=1
              out.append(f'{status}\t{p}\t{h}\t{size}\tDUP={";".join(matches)}')
          header=[f'UNRESOLVED={len(unresolved)}',f'CURRENT_PATH_EXISTS={exists}',f'CURRENT_PATH_MISSING={missing}',f'EXACT_DUPLICATES={dup}']
          Path('.github/prompt1_gap_detail.txt').write_text('\n'.join(header+out)+'\n')
          print('\n'.join(header))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/prompt1_gap_detail.txt
          git commit -m 'chore: search Astra gap duplicates'
          git push origin HEAD:dev
