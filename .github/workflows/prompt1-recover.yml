name: Prompt 1 Compiled Source Recovery

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect release bytecode for missing production sources
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report=.github/prompt1_compiled_source_recovery.txt
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            https://api.github.com/repos/RedsLovesGames/TIDEBORNE/releases/assets/538547228 -o /tmp/tideborne.jar
          curl -fsSL https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar -o /tmp/cfr.jar
          classes=(
            com/redslovesgames/tideborne/fishing/v2/gametest/GearArchetypeCases.class
            com/redslovesgames/tidetraits/client/gui/satchel/SatchelTackleScreen.class
            com/redslovesgames/tidetraits/satchel/SatchelGearSummary.class
            com/redslovesgames/tidetraits/satchel/SatchelLoadouts.class
            com/redslovesgames/tidetraits/satchel/SatchelPreset.class
            com/redslovesgames/tidetraits/satchel/SatchelTackleExchange.class
            com/redslovesgames/tidetraits/satchel/SatchelTackleHandler.class
            com/redslovesgames/tidetraits/satchel/network/TackleRenamePayload.class
            com/redslovesgames/tidetraits/satchel/network/TackleViewPayload.class
          )
          : > "$report"
          echo "JAR_SHA256=$(sha256sum /tmp/tideborne.jar | awk '{print $1}')" >> "$report"
          for c in "${classes[@]}"; do
            if unzip -Z1 /tmp/tideborne.jar | grep -Fxq "$c"; then echo "FOUND $c" >> "$report"; else echo "MISSING $c" >> "$report"; fi
          done
          rm -rf /tmp/decompiled && mkdir /tmp/decompiled
          java -jar /tmp/cfr.jar /tmp/tideborne.jar --outputdir /tmp/decompiled --silent true >/tmp/cfr.log 2>&1 || true
          echo '== decompiled targets ==' >> "$report"
          for c in "${classes[@]}"; do
            f=/tmp/decompiled/${c%.class}.java
            if [ -f "$f" ]; then printf '%s\t%s\t%s\n' "${c%.class}.java" "$(wc -c < "$f")" "$(sha256sum "$f" | awk '{print $1}')" >> "$report"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$report"
          git commit -m 'chore: inspect compiled recovery for missing Java'
          git push origin HEAD:dev
