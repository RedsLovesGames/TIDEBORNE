name: Prompt 1 Repair Migrated Compile Surface

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Restore full screen source and repair only stale import
        shell: bash
        run: |
          set -euo pipefail
          git checkout 3b3987e69424df2c052a2f899e4c9a52aa3d3dc1 -- src/main/java/com/redslovesgames/tideborne/satchel/client/AnglersSatchelScreen.java
          sed -i 's/com\.redslovesgames\.tidetraits\.discovery\.DiscoveryTotals/com.redslovesgames.tideborne.discovery.DiscoveryTotals/' src/main/java/com/redslovesgames/tideborne/satchel/client/AnglersSatchelScreen.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/redslovesgames/tideborne/satchel/client/AnglersSatchelScreen.java
          git commit -m 'fix: repair migrated discovery import without source loss'
          git push origin HEAD:dev
