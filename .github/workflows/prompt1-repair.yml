name: Prompt 1 Repair Satchel Persistence

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/prompt1-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply Satchel persistence patch and compile
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/prompt1_satchel_patch.py
          sed -i 's/\r$//' scripts/fetch_ci_dependencies.sh
          bash scripts/fetch_ci_dependencies.sh >/tmp/deps.log 2>&1
          git checkout -- scripts/fetch_ci_dependencies.sh
          chmod +x gradlew
          set +e
          ./gradlew compileJava --no-daemon >/tmp/compile.log 2>&1
          rc=$?
          set -e
          report=.github/prompt1_repair_compile.txt
          printf 'COMPILE_RC=%s\n' "$rc" > "$report"
          tail -180 /tmp/compile.log >> "$report"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/redslovesgames/tideborne/satchel/AnglersSatchelStorage.java src/main/java/com/redslovesgames/tideborne/satchel/SatchelState.java "$report"
          git commit -m 'fix: restore tested Satchel preset persistence surface'
          git push origin HEAD:dev
          exit "$rc"
