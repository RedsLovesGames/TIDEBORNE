name: P8 Temporary ID Centralization

on:
  push:
    branches:
      - agent/p8-legacy-ids

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[p8-centralized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route historical identities through legacy owners
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          def edit(path, replacements, imports=()):
              p = root / path
              text = p.read_text()
              original = text
              for old, new in replacements:
                  if old in text:
                      text = text.replace(old, new)
              if imports:
                  package_end = text.find('\n', text.find('package '))
                  block = ''.join(f'\nimport {imp};' for imp in imports if f'import {imp};' not in text)
                  if block:
                      text = text[:package_end + 1] + block + '\n' + text[package_end + 1:]
              if text != original:
                  p.write_text(text)

          NS = 'com.redslovesgames.tideborne.migration.legacy.ids.LegacyNamespaces'
          NET = 'com.redslovesgames.tideborne.migration.legacy.ids.LegacyNetworkIds'
          PERSIST = 'com.redslovesgames.tideborne.migration.legacy.ids.LegacyPersistenceIds'
          REG = 'com.redslovesgames.tideborne.migration.legacy.ids.LegacyRegistryIds'
          SERVICE = 'com.redslovesgames.tideborne.migration.legacy.ids.LegacyServiceIds'

          edit('src/main/java/com/redslovesgames/tideborne/command/CommandInputs.java',
               [('"tide_traits".equals(id.getNamespace())', 'LegacyNamespaces.TIDE_TRAITS.equals(id.getNamespace())')], [NS])
          edit('src/main/java/com/redslovesgames/tideborne/command/TideTraitsCommands.java',
               [('TagKey.of(RegistryKeys.ITEM, Identifier.of("tide_traits", path))', 'LegacyServiceIds.tideTraitsItemTag(path)')], [SERVICE])

          edit('src/main/java/com/redslovesgames/tideborne/config/TideborneClientConfig.java', [
              ('private static final String LEGACY_JOURNAL = "tide_team_journal-client.json";', 'private static final String LEGACY_JOURNAL = LegacyPersistenceIds.JOURNAL_CLIENT_CONFIG;'),
              ('private static final String LEGACY_FISHING = "tidebound_compatibility-client.json";', 'private static final String LEGACY_FISHING = LegacyPersistenceIds.TIDEBOUND_CLIENT_CONFIG;')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/config/TideborneConfigStore.java', [
              ('result.put(TRAITS, "tide_traits.json");', 'result.put(TRAITS, LegacyPersistenceIds.TRAITS_CONFIG);'),
              ('result.put(TEAM_SERVER, "tide_team_journal-server.json");', 'result.put(TEAM_SERVER, LegacyPersistenceIds.JOURNAL_SERVER_CONFIG);'),
              ('result.put(FISHING_SERVER, "tidebound_compatibility.json");', 'result.put(FISHING_SERVER, LegacyPersistenceIds.TIDEBOUND_SERVER_CONFIG);')], [PERSIST])

          payloads = {
              'src/main/java/com/redslovesgames/tideborne/discovery/DiscoverySyncPayload.java': [('Identifier.of("tide_traits", "discovery_sync")', 'LegacyNetworkIds.DISCOVERY_SYNC')],
              'src/main/java/com/redslovesgames/tideborne/discovery/multiplayer/SharedDiscoveryRequestPayload.java': [('Identifier.of("tide_traits", "shared_discovery_request")', 'LegacyNetworkIds.SHARED_DISCOVERY_REQUEST')],
              'src/main/java/com/redslovesgames/tideborne/discovery/multiplayer/SharedDiscoverySyncPayload.java': [('Identifier.of("tide_traits", "shared_discovery_sync")', 'LegacyNetworkIds.SHARED_DISCOVERY_SYNC')],
              'src/main/java/com/redslovesgames/tideborne/satchel/network/SatchelRequestPayload.java': [('Identifier.of("tide_traits", "anglers_satchel_request")', 'LegacyNetworkIds.SATCHEL_REQUEST')],
              'src/main/java/com/redslovesgames/tideborne/satchel/network/SatchelViewPayload.java': [('Identifier.of("tide_traits", "anglers_satchel_view")', 'LegacyNetworkIds.SATCHEL_VIEW')],
              'src/main/java/com/redslovesgames/tideborne/journal/network/RecordHoldersPayload.java': [('Identifier.of("tide_team_journal", "record_holders")', 'LegacyNetworkIds.RECORD_HOLDERS')],
              'src/main/java/com/redslovesgames/tideborne/journal/network/TeamDataPayload.java': [('Identifier.of("tide_team_journal", "team_data")', 'LegacyNetworkIds.TEAM_DATA')],
              'src/main/java/com/redslovesgames/tideborne/journal/network/RecordEventPayload.java': [('Identifier.of("tide_team_journal", "record_event")', 'LegacyNetworkIds.RECORD_EVENT')],
              'src/main/java/com/redslovesgames/tideborne/journal/network/BobberSettingsPayload.java': [('Identifier.of("tide_team_journal", "bobber_settings")', 'LegacyNetworkIds.BOBBER_SETTINGS')],
              'src/main/java/com/redslovesgames/tideborne/journal/network/OpenTeamRecordsPayload.java': [('Identifier.of("tide_team_journal", "open_team_records")', 'LegacyNetworkIds.OPEN_TEAM_RECORDS')],
              'src/main/java/com/redslovesgames/tideborne/journal/network/TeamDataRequestPayload.java': [('Identifier.of("tide_team_journal", "team_data_request")', 'LegacyNetworkIds.TEAM_DATA_REQUEST')],
              'src/main/java/com/redslovesgames/tideborne/network/SharkCatchLossPayload.java': [('FishingGameplayInitializer.id("shark_catch_loss")', 'LegacyNetworkIds.SHARK_CATCH_LOSS')],
              'src/main/java/com/redslovesgames/tideborne/network/TideboundSettingsPayload.java': [('FishingGameplayInitializer.id("settings")', 'LegacyNetworkIds.TIDEBOUND_SETTINGS')],
              'src/main/java/com/redslovesgames/tideborne/network/TideboundSettingsResultPayload.java': [('FishingGameplayInitializer.id("settings_result")', 'LegacyNetworkIds.TIDEBOUND_SETTINGS_RESULT')],
              'src/main/java/com/redslovesgames/tideborne/network/TideboundSettingsUpdatePayload.java': [('FishingGameplayInitializer.id("settings_update")', 'LegacyNetworkIds.TIDEBOUND_SETTINGS_UPDATE')],
          }
          for path, reps in payloads.items():
              edit(path, reps, [NET])

          edit('src/main/java/com/redslovesgames/tideborne/discovery/multiplayer/MultiplayerDiscoveryCompat.java',
               [('Identifier.of("tide_traits", "normal")', 'LegacyServiceIds.NORMAL_MUTATION')], [SERVICE])
          edit('src/main/java/com/redslovesgames/tideborne/fishing/specimen/CatchTraitService.java',
               [('Identifier.of("tide_traits", path)', 'LegacyServiceIds.mutation(path)')], [SERVICE])
          edit('src/main/java/com/redslovesgames/tideborne/journal/client/DiscoveryBadgesComponent.java',
               [('Identifier.of("tide_traits", id)', 'LegacyNamespaces.tideTraits(id)')], [NS])
          edit('src/main/java/com/redslovesgames/tideborne/presentation/render/MutationRendering.java',
               [('Identifier.of("tide_traits", "mutation_textures")', 'LegacyServiceIds.MUTATION_TEXTURES_RELOAD_LISTENER')], [SERVICE])

          edit('src/main/java/com/redslovesgames/tideborne/fishing/FishingGameplayInitializer.java', [
              ('public static final String MOD_ID = "tidebound_compatibility";', 'public static final String MOD_ID = LegacyNamespaces.TIDEBOUND_COMPATIBILITY;'),
              ('LoggerFactory.getLogger("tidebound_compatibility")', 'LoggerFactory.getLogger(LegacyNamespaces.TIDEBOUND_COMPATIBILITY)'),
              ('return Identifier.of("tidebound_compatibility", path);', 'return LegacyNamespaces.tideboundCompatibility(path);')], [NS])
          edit('src/main/java/com/redslovesgames/tideborne/fishing/TideTraits.java', [
              ('public static final String MOD_ID = "tide_traits";', 'public static final String MOD_ID = LegacyNamespaces.TIDE_TRAITS;'),
              ('LoggerFactory.getLogger("tide_traits")', 'LoggerFactory.getLogger(LegacyNamespaces.TIDE_TRAITS)')], [NS])
          edit('src/main/java/com/redslovesgames/tideborne/journal/TideTeamJournal.java', [
              ('public static final String MOD_ID = "tide_team_journal";', 'public static final String MOD_ID = LegacyNamespaces.TIDE_TEAM_JOURNAL;'),
              ('LoggerFactory.getLogger("tide_team_journal")', 'LoggerFactory.getLogger(LegacyNamespaces.TIDE_TEAM_JOURNAL)')], [NS])

          edit('src/main/java/com/redslovesgames/tideborne/discovery/multiplayer/SharedDiscoveryNbt.java', [
              ('static final String TEAM_JOURNAL_KEY = "tide_team_journal";', 'static final String TEAM_JOURNAL_KEY = LegacyPersistenceIds.TEAM_JOURNAL_ROOT;'),
              ('static final String TIDE_TRAITS_KEY = "tide_traits";', 'static final String TIDE_TRAITS_KEY = LegacyPersistenceIds.SHARED_DISCOVERY_TRAITS;'),
              ('childCompound(teamExtraData, "tide_team_journal",', 'childCompound(teamExtraData, TEAM_JOURNAL_KEY,'),
              ('childCompound(journalRoot, "tide_traits",', 'childCompound(journalRoot, TIDE_TRAITS_KEY,'),
              ('teamExtraData.get("tide_team_journal")', 'teamExtraData.get(TEAM_JOURNAL_KEY)'),
              ('journalRoot.get("tide_traits")', 'journalRoot.get(TIDE_TRAITS_KEY)')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/journal/JournalSpecimenNetworkCodec.java', [
              ('public static final String CLIENT_KEY = "tide_team_journal_canonical_specimens";', 'public static final String CLIENT_KEY = LegacyPersistenceIds.JOURNAL_CANONICAL_SPECIMENS;'),
              ('public static final String RECORD_HOLDERS_KEY = "tide_team_journal_record_holders";', 'public static final String RECORD_HOLDERS_KEY = LegacyPersistenceIds.JOURNAL_RECORD_HOLDERS;')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/journal/OwnedFishJournalBackfill.java',
               [('private static final String TEAM_ROOT_KEY = "tide_team_journal";', 'private static final String TEAM_ROOT_KEY = LegacyPersistenceIds.TEAM_JOURNAL_ROOT;')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/journal/RecordHolderStore.java', [
              ('public static final String CLIENT_KEY = "tide_team_journal_record_holders";', 'public static final String CLIENT_KEY = LegacyPersistenceIds.JOURNAL_RECORD_HOLDERS;'),
              ('packetTag.put("tide_team_journal_record_holders",', 'packetTag.put(CLIENT_KEY,'),
              ('packetTag.getCompound("tide_team_journal_record_holders")', 'packetTag.getCompound(CLIENT_KEY)')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/journal/RecoveredSpecimenRecordService.java',
               [('private static final String TEAM_ROOT_KEY = "tide_team_journal";', 'private static final String TEAM_ROOT_KEY = LegacyPersistenceIds.TEAM_JOURNAL_ROOT;')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/journal/TeamJournalService.java', [
              ('extraData.contains("tide_team_journal", 10)', 'extraData.contains(LegacyPersistenceIds.TEAM_JOURNAL_ROOT, 10)'),
              ('extraData.put("tide_team_journal", new NbtCompound())', 'extraData.put(LegacyPersistenceIds.TEAM_JOURNAL_ROOT, new NbtCompound())'),
              ('extraData.getCompound("tide_team_journal")', 'extraData.getCompound(LegacyPersistenceIds.TEAM_JOURNAL_ROOT)')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/journal/client/ClientRecordHolders.java',
               [('packetTag.getCompound("tide_team_journal_record_holders")', 'packetTag.getCompound(LegacyPersistenceIds.JOURNAL_RECORD_HOLDERS)')], [PERSIST])
          edit('src/main/java/com/redslovesgames/tideborne/migration/legacy/TideborneMigrationManager.java', [
              ('var0.resolve("tide_traits.json")', 'var0.resolve(LegacyPersistenceIds.TRAITS_CONFIG)'),
              ('var0.resolve("tide_team_journal-server.json")', 'var0.resolve(LegacyPersistenceIds.JOURNAL_SERVER_CONFIG)'),
              ('var0.resolve("tide_team_journal-client.json")', 'var0.resolve(LegacyPersistenceIds.JOURNAL_CLIENT_CONFIG)'),
              ('var0.resolve("tidebound_compatibility.json")', 'var0.resolve(LegacyPersistenceIds.TIDEBOUND_SERVER_CONFIG)'),
              ('var0.resolve("tidebound_compatibility-client.json")', 'var0.resolve(LegacyPersistenceIds.TIDEBOUND_CLIENT_CONFIG)')], [PERSIST])

          edit('src/main/java/com/redslovesgames/tideborne/fishing/gear/FishingGearRegistry.java',
               [('"tidebound_compatibility",', 'LegacyNamespaces.TIDEBOUND_COMPATIBILITY,')], [NS])

          changed = [p for p in Path('src/main/java').rglob('*.java') if p.is_file() and 'migration/legacy/ids' not in p.as_posix()]
          print('Centralization pass complete over', len(changed), 'production Java files')
          PY

          git diff --check
          if git diff --quiet; then
            echo 'No refactor changes remain.'
            exit 0
          fi
          git config user.name 'Tideborne P8 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main/java
          git commit -m 'refactor(p8): centralize historical runtime IDs [p8-centralized]'
          git push origin HEAD:agent/p8-legacy-ids
