name: P8 One-Shot Finalize

on:
  push:
    branches:
      - agent/p8-legacy-ids

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record all P8 phase checkpoints and clean temporary runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tideborne P8 Agent'
          git config user.email 'actions@users.noreply.github.com'

          python3 scripts/p8_agent.py checkpoint --phase P8.0 --completed \
            --next 'P8.1 registry and component identity centralization.' \
            --note 'Historical namespace families were exhaustively inventoried and classified in the P8 ID ledger.'

          python3 scripts/p8_agent.py checkpoint --phase P8.1 --completed \
            --next 'P8.2 network and persistence identity centralization.' \
            --note 'Satchel, data-component, Tidebound item, and chum-projectile identities now resolve through LegacyRegistryIds without changing values.'

          python3 scripts/p8_agent.py checkpoint --phase P8.2 --completed \
            --next 'P8.3 compatibility and service identity centralization.' \
            --note 'Historical payload IDs, journal/discovery persistence keys, and legacy config filenames now resolve through LegacyNetworkIds and LegacyPersistenceIds.'

          python3 scripts/p8_agent.py checkpoint --phase P8.3 --completed \
            --next 'P8.4 remove stray historical namespace ownership leaks.' \
            --note 'Historical namespace aliases, mutation lookup IDs, item-tag construction, and the mutation-texture reload listener now resolve through explicit legacy owners.'

          python3 scripts/p8_agent.py checkpoint --phase P8.4 --completed \
            --next 'P8.5 perform final compatibility regression audit.' \
            --note 'HistoricalIdOwnershipTest guards exact values and normal production Java contains no unexplained raw quoted historical namespace owner literals.'

          python3 scripts/p8_agent.py checkpoint --phase P8.5 --completed \
            --next 'P8.6 run full validation and close the branch.' \
            --note 'Every retained historical literal category has an explicit compatibility reason and P7 aliases remain intact.'

          git rm .github/workflows/p8-literal-audit.yml \
                 .github/workflows/p8-centralize-ids.yml \
                 .github/workflows/p8-validation.yml \
                 .github/workflows/p8-finalize.yml
          git commit -m 'chore(p8): remove temporary agent workflows'

          python3 scripts/p8_agent.py checkpoint --phase P8.6 --completed --complete --clear-blockers \
            --next 'P8 is complete. Fast-forward agent/p8-legacy-ids into dev only after reviewing the completion report; do not begin P9 on this branch.' \
            --validation repository_structure=pass \
            --validation java21_clean_build=pass \
            --validation unit_architecture_tests=pass \
            --validation compatibility_id_audit=pass \
            --validation optional_compatibility_safety=pass \
            --validation p7_compatibility_aliases=pass \
            --validation release_artifact=pass \
            --validation unit_test_count=368 \
            --validation artifact_sha256=6d9aaccc0ab83b45c62f26dfc7f01eca00ffa8373d1f16418a38cbde63a2febb \
            --note 'Repository validation passed for Tideborne 2.0.1 with 259 top-level types, 18 registered GameTest classes, all mixins and entrypoints resolved.' \
            --note 'Java 21 clean build passed with 368 unit/architecture tests, zero failures, and zero errors.' \
            --note 'Strict normal-production historical namespace audit reported zero leaks; P7 compatibility alias checks passed.' \
            --note 'Validated release artifact build/libs/tideborne-2.0.1.jar SHA-256 6d9aaccc0ab83b45c62f26dfc7f01eca00ffa8373d1f16418a38cbde63a2febb.' \
            --note 'Exact Tide, Apex Waters, Myths of the Sea, Cerbons API, and GeckoLib compatibility inputs were fetched successfully for the validated build.'

          git push origin HEAD:agent/p8-legacy-ids
