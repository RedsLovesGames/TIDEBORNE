name: Client Hotfix Release Check

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/client-hotfix-release.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Install client validation tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep xvfb

      - name: Fetch exact compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev/libs

          tide_json="$(curl -fsSLG \
            --data-urlencode 'game_versions=["1.21.1"]' \
            --data-urlencode 'loaders=["fabric"]' \
            --data-urlencode 'include_changelog=false' \
            'https://api.modrinth.com/v2/project/die1AF7i/version')"
          tide_url="$(printf '%s' "$tide_json" | jq -r '[.[] | select(.name == "Tide 2.1.1 (Fabric 1.21.1)")][0].files[] | select(.primary == true) | .url' | head -n1)"
          test -n "$tide_url"
          curl -fsSL "$tide_url" -o dev/libs/tide-fabric-1.21.1-2.1.1.jar
          test "$(unzip -p dev/libs/tide-fabric-1.21.1-2.1.1.jar fabric.mod.json | jq -r '.version')" = '2.1.1'

          curl -fsSL \
            'https://github.com/acorsicanfrog/apexwaters/releases/download/1.1.1/apexwaters-1.21.1-fabric-1.1.1.jar' \
            -o dev/libs/apex-waters-fabric-1.21.1-1.1.1.jar
          echo '00f1c5eaf5b7c2e79a2c64cdeac1a89f2430b2c9ab5f56043f148bde170dba37  dev/libs/apex-waters-fabric-1.21.1-1.1.1.jar' | sha256sum --check --strict

      - name: Build production JAR
        run: ./gradlew clean build --stacktrace

      - name: Validate production JAR
        run: ./scripts/validate_release_artifact.sh build/libs/tideborne-2.0.0.jar

      - name: Headless client startup regression
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/client
          mkdir -p build
          set +e
          timeout 75s xvfb-run -a ./gradlew runClient --console=plain --no-daemon > build/client-hotfix.log 2>&1
          status=$?
          set -e

          log='run/client/logs/latest.log'
          if [[ -f "$log" ]]; then
            cat "$log"
          else
            cat build/client-hotfix.log
          fi

          if rg -n 'Mixin apply for mod tideborne failed|InvalidAccessorException|InvalidMixinException|Minecraft has crashed!|Could not execute entrypoint|NoClassDefFoundError|ExceptionInInitializerError' build/client-hotfix.log "$log" 2>/dev/null; then
            echo 'Tideborne client startup regression detected.' >&2
            exit 1
          fi

          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "Client process exited unexpectedly with status $status." >&2
            exit "$status"
          fi

          if [[ ! -f "$log" ]]; then
            echo 'Minecraft client log was not created.' >&2
            exit 1
          fi

          echo 'Headless client remained crash-free through the startup window.'

      - name: Replace GitHub release JAR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='tideborne-2.0.0-fs2'
          artifact='build/libs/tideborne-2.0.0.jar'
          gh release upload "$tag" "$artifact" --clobber
          gh release edit "$tag" \
            --target c3600a4001862289bf2c3569fb8f40b5a808c588 \
            --title 'Tideborne 2.0.0 - Fishing System 2.0 Build' \
            --notes $'Fishing System 2.0 build for Minecraft 1.21.1, Fabric, and Tide 2.1.1.\n\nHotfix: corrected Tideborne team-journal Screen accessor runtime mappings that could crash the client during mixin application. The replacement JAR passed production artifact validation and a focused headless client startup regression.'
