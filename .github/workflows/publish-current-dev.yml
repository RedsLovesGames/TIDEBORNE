# One-time requested release publisher for the current dev candidate.
name: Publish Current Dev Build

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/publish-current-dev.yml'

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-current-dev]')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Fetch exact Tide 2.1.1 dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dev/libs
          tide_json="$(curl -fsSLG \
            --data-urlencode 'game_versions=["1.21.1"]' \
            --data-urlencode 'loaders=["fabric"]' \
            --data-urlencode 'include_changelog=false' \
            'https://api.modrinth.com/v2/project/die1AF7i/version')"
          tide_url="$(printf '%s' "$tide_json" | jq -r '[.[] | select(.name == "Tide 2.1.1 (Fabric 1.21.1)")][0].files[] | select(.primary == true) | .url' | head -n1)"
          test -n "$tide_url"
          curl -fsSL "$tide_url" -o dev/libs/tide-fabric-1.21.1-2.1.1.jar
          test "$(unzip -p dev/libs/tide-fabric-1.21.1-2.1.1.jar fabric.mod.json | jq -r '.version')" = '2.1.1'

      - name: Validate repository metadata
        run: ./scripts/validate_repository.sh

      - name: Build release JAR
        run: ./gradlew clean build --stacktrace

      - name: Validate release JAR
        run: ./scripts/validate_release_artifact.sh build/libs/tideborne-2.0.0.jar

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='tideborne-2.0.0-fs2'
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title 'Tideborne 2.0.0 - Fishing System 2.0 Build' \
            --notes $'Build of the current dev release candidate for Tideborne 2.0.0 / Fishing System 2.0.\n\nThe unit and GameTest regression matrix passed on the candidate preceding this release workflow commit. The dedicated-server client-connect smoke check remained non-green and was treated as non-blocking for this requested build.\n\nMinecraft 1.21.1 | Fabric | Tide 2.1.1' \
            'build/libs/tideborne-2.0.0.jar#tideborne-2.0.0.jar'
