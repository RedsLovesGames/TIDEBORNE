name: Reconstruct Tideborne 1.3.57 source

on:
  push:
    branches:
      - reconstruct-1.3.57
    paths:
      - reconstruction/input/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    name: Recover source and wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Decode and verify authoritative Tideborne JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reconstruction/work
          cat reconstruction/input/tideborne-1.3.57.jar.b64.part-* \
            | tr -d '\r\n' \
            | base64 --decode \
            > reconstruction/work/Tideborne-1.3.57.jar

          echo '0c8cd9e9706c2e1cc0a6ca3708c050d5f1d501a0df63d75047188e9fb4b4c4f5  reconstruction/work/Tideborne-1.3.57.jar' \
            | sha256sum --check --strict

      - name: Reconstruct named source and resources
        shell: bash
        run: |
          set +e
          python3 scripts/reconstruct_sources.py \
            reconstruction/work/Tideborne-1.3.57.jar \
            --repo "$GITHUB_WORKSPACE" \
            --force
          status=$?
          set -e

          # Exit 2 means the decompiler completed but left intermediary tokens
          # that need a human/agent cleanup pass. Preserve the generated source.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Generate pinned Gradle wrapper
        run: gradle wrapper --gradle-version 8.12 --distribution-type bin

      - name: Remove temporary encoded reconstruction input
        run: rm -rf reconstruction/input reconstruction/work

      - name: Commit reconstructed baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconstruction changes to commit.'
          else
            git commit -m 'Reconstruct Tideborne 1.3.57 source baseline'
            git push origin HEAD:reconstruct-1.3.57
          fi

      - name: Compile reconstructed source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace --warning-mode all
