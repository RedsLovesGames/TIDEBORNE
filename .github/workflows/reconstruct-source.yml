name: Reconstruct Tideborne 1.3.57 source

on:
  push:
    branches:
      - reconstruct-1.3.57
    paths:
      - Tideborne-1.3.57-perfect-catch-trait-luck.jar
      - .github/workflows/reconstruct-source.yml
      - scripts/reconstruct_sources.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    name: Recover source and wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out reconstruction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Verify authoritative 1.3.57 release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR='Tideborne-1.3.57-perfect-catch-trait-luck.jar'

          test -f "$JAR"
          echo '0c8cd9e9706c2e1cc0a6ca3708c050d5f1d501a0df63d75047188e9fb4b4c4f5  Tideborne-1.3.57-perfect-catch-trait-luck.jar' \
            | sha256sum --check --strict

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import struct
          import zipfile

          jar = Path('Tideborne-1.3.57-perfect-catch-trait-luck.jar')
          with zipfile.ZipFile(jar) as archive:
              files = sorted((info.filename, archive.read(info.filename)) for info in archive.infolist() if not info.is_dir())
          digest = hashlib.sha256()
          classes = 0
          for name, data in files:
              encoded = name.encode('utf-8')
              digest.update(struct.pack('>I', len(encoded)))
              digest.update(encoded)
              digest.update(struct.pack('>Q', len(data)))
              digest.update(data)
              classes += name.endswith('.class')
          actual = digest.hexdigest()
          expected = '5a825aa33436ed24110b984390455f5d048a651499e4cecd68efa1402ee6aec6'
          resources = len(files) - classes
          print(f'Content files: {len(files)}; classes: {classes}; resources: {resources}; tree SHA-256: {actual}')
          if len(files) != 442 or classes != 272 or resources != 170 or actual != expected:
              raise SystemExit('Authoritative content-tree verification failed')
          PY

      - name: Reconstruct named source and resources
        shell: bash
        run: |
          set +e
          python3 scripts/reconstruct_sources.py \
            Tideborne-1.3.57-perfect-catch-trait-luck.jar \
            --repo "$GITHUB_WORKSPACE" \
            --force
          status=$?
          set -e

          # Exit 2 means the decompiler completed but left intermediary tokens
          # that need a cleanup pass. Preserve the generated source for repair.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Generate pinned Gradle wrapper
        run: gradle wrapper --gradle-version 8.12 --distribution-type bin

      - name: Remove obsolete chunk-transfer payload
        shell: bash
        run: |
          rm -rf reconstruction/input reconstruction/work

      - name: Commit reconstructed baseline before compile repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconstruction changes to commit.'
          else
            git commit -m 'Reconstruct Tideborne 1.3.57 source baseline'
            git push origin HEAD:reconstruct-1.3.57
          fi

      - name: Compile reconstructed source
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace --warning-mode all
