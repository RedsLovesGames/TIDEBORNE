name: P7 Temporary Data Validation

on:
  push:
    branches:
      - agent/p7-resources

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'chore: stage P7.2 validation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch exact external compile dependencies
        shell: bash
        run: bash scripts/fetch_ci_dependencies.sh
      - name: Validate P7.2 resource layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = Path('src/main/resources/data')
          canonical = data / 'tideborne'
          legacy = data / 'tidebound_compatibility'
          accessories = {
              'copper_leader.json',
              'diamond_leader.json',
              'gold_leader.json',
              'seafarers_hook.json',
              'shark_tooth_hook.json',
              'steel_leader.json',
              'swift_line.json',
              'tentacle_line.json',
          }
          bait = canonical / 'bait/leviathan_bait.json'
          if not bait.is_file():
              raise SystemExit('Missing canonical Leviathan bait data')
          actual = {p.name for p in (canonical / 'rod_accessories').glob('*.json')}
          if actual != accessories:
              raise SystemExit(f'Unexpected canonical accessory set: {sorted(actual)}')
          if (legacy / 'bait').exists() or (legacy / 'rod_accessories').exists():
              raise SystemExit('Historical bundled flat-data directories still exist')

          for path in [bait, *[canonical / 'rod_accessories' / name for name in accessories]]:
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not str(payload.get('item', '')).startswith('tidebound_compatibility:'):
                  raise SystemExit(f'Historical item identity changed in {path}')

          required_compat = [
              legacy / 'recipe/leviathan_bait.json',
              legacy / 'tags/item/shark_food.json',
              data / 'tide_traits/recipe/anglers_satchel.json',
              data / 'tide_traits/tags/item/mutation_excluded.json',
              data / 'tide/tags/item/bait_items.json',
              data / 'myths_of_the_sea/tags/item/hippocampus_food.json',
          ]
          missing = [str(path) for path in required_compat if not path.exists()]
          if missing:
              raise SystemExit('Compatibility or foreign data moved unexpectedly: ' + ', '.join(missing))

          print('P7.2 static data ownership validation passed')
          PY
      - name: Run focused Java 21 tests
        shell: bash
        run: |
          ./gradlew test \
            --tests com.redslovesgames.tideborne.assets.DataResourceOwnershipTest \
            --tests com.redslovesgames.tideborne.fishing.gear.FishingGearRegistryTest
      - name: Remove temporary validation workflow
        shell: bash
        run: |
          rm -f .github/workflows/p7-temp-data-validation.yml
          git config user.name "RedsLovesGames"
          git config user.email "75150137+RedsLovesGames@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove P7.2 validation workflow"
          git push origin HEAD:agent/p7-resources
