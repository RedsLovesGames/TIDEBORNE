<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07161a">
  <meta name="description" content="Official Tideborne 2.1.0 wiki for Minecraft 1.21.1 Fabric and Tide 2.1.1.">
  <title>Tideborne Wiki</title>
  <link rel="icon" href="assets/tideborne-icon.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="Tideborne Wiki home">
        <img src="assets/tideborne-icon.png" alt="" width="38" height="38">
        <span><strong>Tideborne</strong><small>Official Wiki</small></span>
      </a>
      <div class="topbar-actions">
        <button class="search-button" id="searchButton" type="button" aria-label="Search wiki">
          <span aria-hidden="true">⌕</span><span>Search</span><kbd>/</kbd>
        </button>
        <a class="repo-link" href="https://github.com/RedsLovesGames/TIDEBORNE" target="_blank" rel="noreferrer">GitHub</a>
        <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Open navigation">☰</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Wiki navigation">
      <nav id="wikiNav"></nav>
      <div class="sidebar-footer">
        <span>Docs target</span>
        <strong>Tideborne 2.1.0</strong>
        <small>Minecraft 1.21.1 · Fabric</small>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div id="pageContent" class="page-content" aria-live="polite"></div>
      <footer class="page-footer">
        <span>Verified against Tideborne 2.1.0</span>
        <a href="https://github.com/RedsLovesGames/TIDEBORNE/tree/dev/docs/wiki" target="_blank" rel="noreferrer">View wiki source</a>
      </footer>
    </main>
  </div>

  <dialog class="search-dialog" id="searchDialog">
    <form method="dialog" class="search-head">
      <label for="searchInput">Search the Tideborne wiki</label>
      <button type="submit" aria-label="Close search">×</button>
    </form>
    <input id="searchInput" type="search" autocomplete="off" placeholder="Try “FishScore”, “Giant”, “Satchel”, “leader”…">
    <div id="searchResults" class="search-results"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
